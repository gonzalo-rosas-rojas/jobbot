<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The browser bar takes the night of the stage (--night-0, held by test/template.meta.test.mjs). One tag, no light/dark pair: the panel does
     not follow the system scheme and Papel repaints only the sheet, so the top of the window is the night in both themes. -->
<meta name="theme-color" content="#06080e">
<title>Panel</title>
<script nonce="__NONCE__">
/* Before the first paint: the theme and the language. ?theme=dark|light and ?lang=es|en win (the demo on a site
   asks for them), then the choice saved here, otherwise the system decides. */
(function () {
  try {
    var p = new URLSearchParams(location.search);
    var q = p.get("theme");
    var t = q === "dark" || q === "light" ? q : localStorage.getItem("panel.theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    var l = p.get("lang");
    l = l === "es" || l === "en" ? l : localStorage.getItem("panel.lang");
    if (l === "es" || l === "en") document.documentElement.setAttribute("lang", l);
  } catch (e) { /* the system theme and the default language stay */ }
})();
</script>
<!-- Own fonts and images come from CSS only, through the asset placeholder; see panel-src/README.md. -->
<style nonce="__NONCE__">
/* Colours, type scale and measures of the panel (spec §4). Tinta (night glass) is the default and the only theme the sky
   follows; Papel changes only the sheet (§2.2). Every hex colour of the page is written in this block: the colour tests of
   Node (test/contrast.test.mjs) and Rust (src/panel/mod.rs) read it as written, and the rest of the CSS uses var(--...). */
:root {
  color-scheme: dark;
  --night-0: #06080e;
  --night-1: #0a0e19;
  --night-2: #101626;
  --text: #e9eff7;
  --text-dim: #9eacbe;
  --text-faint: #7b869e;
  --gold: #fbc024;
  --mint: #5bf0b8;
  --window: #ffd9a8;
  --paper: #edf0f6;
  --paper-ink: #131f35;
  --paper-dim: #4c596c;
  --gold-ink: #704500;
  --alert: #ff8a80;                                   /* a real warning (a thing that is wrong, not a thing that is his to do): outside the gold */

  --sheet-bg: rgba(8, 12, 22, 0.72);
  --sheet-filter: blur(22px) saturate(1.25);
  --ink: var(--text);
  --ink-dim: var(--text-dim);
  --ink-accent: var(--gold);
  --ink-alert: var(--alert);
  --line: rgba(233, 239, 247, 0.13);
  --line-strong: rgba(233, 239, 247, 0.3);
  --veil: rgba(6, 8, 14, 0.55);

  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --serif: "Instrument Serif", Georgia, serif;
  --mono: "Geist Mono", ui-monospace, Consolas, monospace;
  --body: Inter, "Segoe UI", system-ui, sans-serif;
  --fs-1: 11px;
  --fs-2: 13px;
  --fs-3: 15px;
  --fs-4: 22px;
  --fs-5: 34px;
  --fs-6: 64px;
  --fs-7: 120px;

  --gutter: clamp(24px, 3.3vw, 64px);
  --hud: 56px;
  --sheet: min(calc(100vw - 2 * var(--gutter)), clamp(960px, 58vw, 1400px));   /* the clamp of spec A13, never wider than the window (760-1010 px) */
  --drawer: clamp(400px, 13vw, 460px);
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-jump: cubic-bezier(0.2, 0, 0, 1);
}

:root[data-theme="light"] {
  --sheet-bg: #edf0f6;
  --sheet-filter: none;
  --ink: #131f35;
  --ink-dim: #4c596c;
  --ink-accent: #704500;
  --ink-alert: #9b1c1c;
  --line: rgba(19, 31, 53, 0.14);
  --line-strong: rgba(19, 31, 53, 0.32);
}

@media (min-width: 2400px) {
  :root {
    --fs-1: 12px;
    --fs-2: 15px;
    --fs-3: 16px;
    --fs-4: 26px;
    --fs-5: 40px;
    --fs-6: 80px;
    --fs-7: 150px;
  }
}

@font-face { font-family: "Barlow Condensed"; font-weight: 700; font-style: normal; font-display: swap; src: url("__ASSETS__/barlow-condensed-700.woff2") format("woff2"); }
@font-face { font-family: "Instrument Serif"; font-weight: 400; font-style: italic; font-display: swap; src: url("__ASSETS__/instrument-serif-400italic.woff2") format("woff2"); }
@font-face { font-family: "Geist Mono"; font-weight: 400; font-style: normal; font-display: swap; src: url("__ASSETS__/geist-mono-400.woff2") format("woff2"); }
@font-face { font-family: Inter; font-weight: 400; font-style: normal; font-display: swap; src: url("__ASSETS__/inter-400.woff2") format("woff2"); }
@font-face { font-family: Inter; font-weight: 600; font-style: normal; font-display: swap; src: url("__ASSETS__/inter-600.woff2") format("woff2"); }
