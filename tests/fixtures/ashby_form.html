<script>
  // What the real page's React does with a Yes/No question, enough for the filler's clicks: a click
  // presses that button and releases its neighbour, and a second click on the pressed button
  // releases it again (so a filler that clicked blindly would undo its own answer).
  document.querySelectorAll('.ashby-application-form-input-yesno').forEach(function (box) {
    var buttons = box.querySelectorAll('button');
    var hidden = box.querySelector('input[type="checkbox"]');
    buttons.forEach(function (button) {
      button.addEventListener('click', function () {
        var wasPressed = button.getAttribute('aria-pressed') === 'true';
        buttons.forEach(function (other) { other.setAttribute('aria-pressed', 'false'); });
        if (!wasPressed) button.setAttribute('aria-pressed', 'true');
        hidden.checked = !wasPressed && button.getAttribute('data-option') === 'yes';
      });
    });
  });
</script>
