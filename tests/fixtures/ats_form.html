<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply - Senior AI Engineer (test fixture)</title></head>
<body>
<h1>Apply for Senior AI Engineer</h1>
<form id="app">
  <div><label for="first_name">First name *</label> <input id="first_name" name="first_name" type="text" required></div>
  <div><label for="last_name">Last name *</label> <input id="last_name" name="last_name" type="text" required></div>
  <div><label for="email">Email *</label> <input id="email" name="email" type="email" required></div>
  <div><label for="phone">Phone</label> <input id="phone" name="phone" type="tel"></div>
  <div>
    <label for="country">Country</label>
    <select id="country" name="country">
      <option value="">--</option><option value="cl">Chile</option><option value="us">United States</option>
    </select>
  </div>
  <div><label for="resume">Resume/CV *</label> <input id="resume" name="resume" type="file" required> <span id="filename"></span></div>
  <div id="extra"></div>
  <button id="submit" type="submit" disabled>Submit application</button>
</form>
<p id="confirm" hidden></p>
<script>
  // The fixture is one page with several behaviours, chosen with ?variant=NAME.
  var variant = new URLSearchParams(location.search).get('variant') || 'default';
  var extra = document.getElementById('extra');
  var frame = function (name) {
    return '<iframe title="' + name + '" src="about:blank#' + name + '" width="300" height="80"></iframe>';
  };

  // Generic behaviour first, so the handlers survive the variants that detach the form.
  // The submit button only becomes enabled after a delay, to exercise auto-waiting.
  setTimeout(function () { var b = document.getElementById('submit'); if (b) b.disabled = false; }, 400);
  // Counts every click on the button, including one that native validation then blocks.
  document.getElementById('submit').addEventListener('click', function () { window.clicks = (window.clicks || 0) + 1; });
  document.getElementById('resume').addEventListener('change', function (e) {
    var f = e.target.files[0];
    document.getElementById('filename').textContent = f ? f.name + ' (' + f.size + ' bytes)' : '';
  });
  document.getElementById('app').addEventListener('submit', function (e) {
    e.preventDefault();
    if (variant === 'silent') return;          // the page reacts to the click with nothing visible
    if (variant === 'rejects') {               // a validation error instead of a confirmation
      document.getElementById('phone').setAttribute('aria-invalid', 'true');
      extra.innerHTML = '<p role="alert">Phone number is invalid.</p>';
      return;
    }
    if (variant === 'redirect') {              // a thank-you page at another address, with no thank-you text
      location.search = '?variant=thanks';
      return;
    }
    window.submitted = true;
    var c = document.getElementById('confirm');
    c.textContent = 'Thank you, ' + document.getElementById('first_name').value + '. Your application was received.';
    c.hidden = false;
  });

  if (variant === 'extra_required') {
    extra.innerHTML = '<label for="paradigm">Favorite programming paradigm *</label> <input id="paradigm" name="paradigm" type="text" required>';
  } else if (variant === 'recaptcha') {
    extra.innerHTML = frame('recaptcha');
  } else if (variant === 'hcaptcha') {
    extra.innerHTML = frame('hcaptcha');
  } else if (variant === 'code') {
    extra.innerHTML = '<p>We sent a verification code to your email. Enter it to continue.</p>';
  } else if (variant === 'captcha_after_fill') {
    // The widget only appears once somebody types, like real invisible captchas.
    document.getElementById('first_name').addEventListener('input', function () { extra.innerHTML = frame('recaptcha'); });
  } else if (variant === 'login') {
    extra.innerHTML = '<p>Sign in to apply</p><label for="pw">Password</label> <input id="pw" type="password">';
  } else if (variant === 'blocked') {
    document.body.innerHTML = '<h1>Access denied</h1><p>Unusual traffic from your network was detected.</p>';
  } else if (variant === 'no_form') {
    document.body.innerHTML = '<h1>Apply</h1><p>Please email us your CV.</p>';
  } else if (variant === 'spa') {
    // Hosted boards render the form from JavaScript after load: take it out, put it back later.
    var form = document.getElementById('app'), confirmNode = document.getElementById('confirm');
    form.remove();
    setTimeout(function () { document.body.insertBefore(form, confirmNode); }, 700);
  } else if (variant === 'invisible_captcha') {
    // Greenhouse's badge: visible on every form, but its frame address says size=invisible. Not a wall.
    extra.innerHTML = '<div class="grecaptcha-badge" style="width:256px;height:60px"><iframe title="reCAPTCHA" src="about:blank#recaptcha/api2/anchor?size=invisible" width="256" height="60"></iframe></div>';
  } else if (variant === 'radio') {
    extra.innerHTML = '<fieldset><legend>Do you require visa sponsorship? *</legend>' +
      '<label><input type="radio" name="sponsor" value="yes" required> Yes</label> ' +
      '<label><input type="radio" name="sponsor" value="no" required> No</label></fieldset>';
  } else if (variant === 'radio_lever') {
    // Lever-style: no fieldset, the question is a plain div above the options.
    extra.innerHTML = '<div class="application-question"><div class="application-label">Do you require visa sponsorship? *</div>' +
      '<label><input type="radio" name="sponsor2" value="yes" required> Yes</label> ' +
      '<label><input type="radio" name="sponsor2" value="no" required> No</label></div>';
  } else if (variant === 'consent') {
    extra.innerHTML = '<label><input id="privacy" type="checkbox" required> I have read and accept the Privacy Policy *</label>';
  } else if (variant === 'select_alt') {
    extra.innerHTML = '<label for="source">How did you hear about us? *</label> <select id="source" name="source" required>' +
      '<option value="">--</option><option value="web">Company website</option><option value="other">Other</option></select>';
  } else if (variant === 'select_case') {
    // The page's option is "Job Board"; the bank says "Job board".
    extra.innerHTML = '<label for="source">How did you hear about us? *</label> <select id="source" name="source" required>' +
      '<option value="">--</option><option value="board">Job Board</option><option value="other">Other</option></select>';
  } else if (variant === 'required_country' || variant === 'auto_submit_required_country') {
    // The country is a required question (a star in the label, not the `required` attribute).
    document.querySelector('label[for="country"]').textContent = 'Country *';
    if (variant === 'auto_submit_required_country') {
      document.getElementById('resume').addEventListener('change', function () {
        setTimeout(function () { document.getElementById('submit').click(); }, 2500);
      });
    }
  } else if (variant === 'prechecked') {
    // An optional box the page ticked by itself, signing him up for marketing and SMS.
    extra.innerHTML = '<label><input id="marketing" type="checkbox" checked> Yes, send me marketing emails and SMS alerts</label>';
  } else if (variant === 'auto_submit') {
    // Stands in for Gonza in assisted mode: the page itself clicks submit 2.5 s after the CV upload.
    document.getElementById('resume').addEventListener('change', function () {
      setTimeout(function () { document.getElementById('submit').click(); }, 2500);
    });
  } else if (variant === 'assist_finishes') {
    // Assisted mode with a question only Gonza can answer, far below the fold. The page plays
    // Gonza: 2 s after the CV upload it records what the filler left behind (the question
    // untouched, flagged, scrolled into view), answers it, and 1 s later clicks submit.
    extra.innerHTML = '<div style="height:2500px"></div>' +
      '<label for="essay">Why are you interested in this role? *</label> <textarea id="essay" name="essay" required></textarea>';
    document.getElementById('resume').addEventListener('change', function () {
      setTimeout(function () {
        var essay = document.getElementById('essay');
        var rect = essay.getBoundingClientRect();
        window.review = {
          essayBefore: essay.value,
          flagged: document.querySelectorAll('[data-jb-todo]').length,
          essayFlagged: essay.hasAttribute('data-jb-todo'),
          essayInView: rect.top >= 0 && rect.bottom <= window.innerHeight,
        };
        essay.value = 'Because I build agents.';
        essay.dispatchEvent(new Event('input', { bubbles: true }));
        window.review.flaggedAfterAnswer = document.querySelectorAll('[data-jb-todo]').length;
        setTimeout(function () { document.getElementById('submit').click(); }, 1000);
      }, 2000);
    });
  } else if (variant === 'no_cv_field') {
    // A form with no resume input at all (some boards only take a profile link).
    document.getElementById('resume').closest('div').remove();
  } else if (variant === 'thanks') {
    document.body.innerHTML = '<h1>Done</h1>';
  }
</script>
</body>
</html>
