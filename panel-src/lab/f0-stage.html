<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage lab</title>
<style nonce="__NONCE__">
/*__STYLE__*/
.lab-stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: var(--night-1); }
.lab-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.lab-ground .dial-svg > :not(text) { visibility: hidden; }
.lab-nohalo .dial-num, .lab-nohalo .dial-micro, .lab-nohalo .dial-time { stroke: none; }
.lab-mask .lab-stage { background: #000; }
.lab-mask #sky, .lab-mask .sky-front, .lab-mask .lab-sheet { visibility: hidden; }
.lab-mask .dial-svg > :not(text) { visibility: hidden; }
.lab-mask .dial-num, .lab-mask .dial-micro, .lab-mask .dial-time { fill: #fff !important; stroke: none !important; }
.lab-sheet { position: absolute; left: var(--gutter); top: 78px; width: var(--sheet); bottom: 117px; background: var(--sheet-bg); backdrop-filter: var(--sheet-filter); z-index: 5; }
</style>
</head>
<body>
<div class="lab-stage">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div id="dial" class="dial" aria-hidden="true"></div>
  <main id="app" class="lab-sheet"></main>
</div>
<script nonce="__NONCE__">
/*__SCRIPT__*/
</script>
</body>
</html>
