<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The browser bar takes the night of the stage (--night-0, held by test/template.meta.test.mjs). One tag, no light/dark pair: the panel does
     not follow the system scheme and Papel repaints only the sheet, so the top of the window is the night in both themes. -->
<meta name="theme-color" content="#06080e">
<title>Panel</title>
<script nonce="__NONCE__">
/* Before the first paint: the theme and the language. ?theme=dark|light and ?lang=es|en win (the demo on a site
   asks for them), then the choice saved here, otherwise the system decides. */
(function () {
  try {
    var p = new URLSearchParams(location.search);
    var q = p.get("theme");
    var t = q === "dark" || q === "light" ? q : localStorage.getItem("panel.theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    var l = p.get("lang");
    l = l === "es" || l === "en" ? l : localStorage.getItem("panel.lang");
    if (l === "es" || l === "en") document.documentElement.setAttribute("lang", l);
  } catch (e) { /* the system theme and the default language stay */ }
})();
</script>
<!-- Own fonts and images come from CSS only, through the asset placeholder; see panel-src/README.md. -->
<style nonce="__NONCE__">
/*__STYLE__*/
</style>
</head>
<body>
<div id="doc" class="doc">
  <div id="stage" class="stage">
    <canvas id="sky" aria-hidden="true"></canvas>
    <div id="dial" class="dial" aria-hidden="true"></div>
    <div id="shell"></div>
  </div>
  <section class="stop-spacer" data-stop="hoy" aria-hidden="true"></section>
  <section class="stop-spacer" data-stop="procesos" aria-hidden="true"></section>
  <section class="stop-spacer" data-stop="cola" aria-hidden="true"></section>
  <section class="stop-spacer" data-stop="aprender" aria-hidden="true"></section>
  <section class="stop-spacer" data-stop="sistema" aria-hidden="true"></section>
</div>
<!--__ICONS__-->
<script nonce="__NONCE__">
/*__SCRIPT__*/
</script>
</body>
</html>
