<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel</title>
<script nonce="__NONCE__">
/* The theme before the first paint: ?theme=dark|light wins (the demo on a site asks for it), then the choice
   made here with the T key, otherwise the system decides. */
(function () {
  try {
    var q = new URLSearchParams(location.search).get("theme");
    var t = q === "dark" || q === "light" ? q : localStorage.getItem("panel.theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  } catch (e) { /* the system theme stays */ }
})();
</script>
<style nonce="__NONCE__">
/* A station for a job search. Every application is a train going through the same five stops, the
   board at the top says at a glance what is waiting for Gonza, and gold means "your turn". The
   board is the one loud thing; everything under it is a quiet printed timetable. */
/* Two themes from one set of rules (docs/COLOR.md). Papel is the light one, Tinta the dark one; both follow the
   system until the T key or the button chooses. Colours are built in OKLCH: one blue (hue 262) for ink and
   structure because blue is the colour people read as trustworthy, its complement amber (hue 85) reserved for
   "your turn", a green only for what is confirmed and a red only for what is late. Every text pair passes
   WCAG AAA or AA, and the four meanings stay apart for the three kinds of colour blindness. */
:root {
  color-scheme: light dark;
  --paper: #edf0f6; --surface: #f7f9fc; --raise: #ffffff; --ink: #131f35; --muted: #4c596c; --line: #cbd2da; --line-soft: #dfe3ea;
  --track: #2063b0; --track-soft: #d5e9fe; --track-ink: #173c70;
  --gold: #fbc024; --gold-ink: #131f35; --gold-soft: #fcf0cb; --gold-text: #704500;
  --bad: #c72d31; --bad-soft: #fee9e7; --on-bad: #ffffff; --ok: #00563a; --ok-soft: #d7f8e8;
  --board: #131f35; --board-hi: #212e45; --board-lo: #0c1628; --board-edge: #2d384d; --chalk: #edf2f9; --chalk-dim: #99a6b8; --gap: #020511;
  --urgent: #d02b31;
  --on-board-ok: #5bf0b8;
  --shade: color-mix(in srgb, var(--gap) 45%, transparent);
  --mood: var(--track);
  --display: "Bahnschrift", "DIN Alternate", "Segoe UI Semibold", "Arial Narrow", system-ui, sans-serif;
  --cond: "Bahnschrift Condensed", "Bahnschrift", "DIN Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Segoe UI", system-ui, -apple-system, sans-serif;
  --ease: cubic-bezier(.23, 1, .32, 1);
  --ease-expo: cubic-bezier(.16, 1, .3, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0a101c; --surface: #121926; --raise: #1b2331; --ink: #e9eff7; --muted: #9eacbe; --line: #2b3648; --line-soft: #1d2634;
    --track: #61afee; --track-soft: #192f46; --track-ink: #abd7fd;
    --gold: #fbc024; --gold-ink: #101a2d; --gold-soft: #3a2c01; --gold-text: #fed25f;
    --bad: #ef6661; --bad-soft: #391716; --on-bad: #060d1a; --ok: #5bf0b8; --ok-soft: #013424;
    --board: #101a2d; --board-hi: #1d283b; --board-lo: #091121; --board-edge: #2f3b50; --chalk: #edf2f9; --chalk-dim: #99a6b8; --gap: #01030c;
    --urgent: #fa6863;
  }
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0a101c; --surface: #121926; --raise: #1b2331; --ink: #e9eff7; --muted: #9eacbe; --line: #2b3648; --line-soft: #1d2634;
  --track: #61afee; --track-soft: #192f46; --track-ink: #abd7fd;
  --gold: #fbc024; --gold-ink: #101a2d; --gold-soft: #3a2c01; --gold-text: #fed25f;
  --bad: #ef6661; --bad-soft: #391716; --on-bad: #060d1a; --ok: #5bf0b8; --ok-soft: #013424;
  --board: #101a2d; --board-hi: #1d283b; --board-lo: #091121; --board-edge: #2f3b50; --chalk: #edf2f9; --chalk-dim: #99a6b8; --gap: #01030c;
  --urgent: #fa6863;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0; color: var(--ink); font: 15px/1.5 var(--body); background: var(--paper); }
:focus-visible { outline: 3px solid var(--track); outline-offset: 2px; }
a { color: var(--track); text-underline-offset: 3px; text-decoration-thickness: 1px; }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 600; margin: 0; letter-spacing: .005em; }
h2 { font-size: 28px; line-height: 1.1; font-variation-settings: "wdth" 88; }
h3 { font-size: 17px; }
h4 { font-size: 15px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.wrap-any { overflow-wrap: anywhere; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---- The board: split-flap counters. Each flap is four halves; the letters are painted by CSS from
   data-c, so no text sits in the page and a screen reader reads the plain numbers instead. */
.board { background: var(--board); color: var(--chalk); border-bottom: 1px solid var(--board-edge); }
.board-in { max-width: 1240px; margin: 0 auto; padding: 18px 20px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px 36px; align-items: end; }
.b-info { display: grid; gap: 9px; justify-self: center; align-self: end; padding-bottom: 8px; font: 600 13px/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--chalk-dim); }
.b-info .led::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 9px; border-radius: 50%; background: color-mix(in srgb, var(--chalk-dim) 45%, var(--board)); vertical-align: 1px; }
.b-info .led.on::before { background: var(--on-board-ok); }
.b-info .led.off::before { background: var(--gold); }
.b-counters { display: flex; flex-wrap: wrap; gap: 14px 34px; }
.b-group { display: grid; gap: 7px; justify-items: start; }
.plate { font: 600 12px/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--chalk-dim); padding-left: 2px; }
.b-clock { display: flex; align-items: flex-end; gap: 18px; }
.b-time { display: grid; gap: 7px; justify-items: end; }
.b-dial { display: block; width: 92px; height: 92px; flex: none; }
.dl-face { fill: color-mix(in srgb, var(--chalk) 5%, transparent); stroke: var(--board-edge); stroke-width: 1; }
.dl-busy { fill: none; stroke: var(--chalk-dim); stroke-opacity: .5; stroke-width: 5; stroke-dasharray: 1.3 1.7; }
.dl-rail { fill: none; stroke: var(--board-edge); stroke-width: 3; }
.dl-lit { fill: none; stroke: var(--on-board-ok); stroke-width: 3; stroke-linecap: round; }
.dl-tick { stroke: var(--chalk-dim); stroke-width: 1; stroke-opacity: .75; }
.dl-hand line { stroke: var(--chalk); stroke-width: 1.6; stroke-linecap: round; }
.dl-tip { fill: var(--gold); }
.dl-hub { fill: var(--chalk); }
.flaps { display: inline-flex; align-items: center; font-family: var(--cond); font-weight: 700; }
.flaps.big { font-size: 56px; }
.flaps.mid { font-size: 56px; }
.flaps.small { font-size: 22px; }
.fl { position: relative; display: inline-block; width: .62em; height: 1.12em; margin: 0 .04em; perspective: 520px; font-size: 1em; line-height: 1.12; }
.fl.colon { width: .3em; }
.fl > i { position: absolute; left: 0; right: 0; height: 50%; overflow: hidden; font-style: normal; backface-visibility: hidden; }
.fl > i::before { content: attr(data-c); position: absolute; left: 0; right: 0; height: 200%; text-align: center; line-height: 1.12em; color: var(--chalk); }
.fl .t, .fl .ft { top: 0; border-radius: .09em .09em 0 0; background: linear-gradient(180deg, var(--board-edge), var(--board-hi)); transform-origin: 50% 100%; }
.fl .b, .fl .fb { bottom: 0; border-radius: 0 0 .09em .09em; background: linear-gradient(180deg, color-mix(in srgb, var(--board-hi) 70%, var(--board)), var(--board-hi)); transform-origin: 50% 0; }
.fl .t::before, .fl .ft::before { top: 0; }
.fl .b::before, .fl .fb::before { top: -100%; }
.fl .ft, .fl .fb { visibility: hidden; z-index: 3; }
.fl .fb { transform: rotateX(90deg); }
.flaps.zero .fl > i::before { color: var(--chalk-dim); }
.fl.go .ft, .fl.go .fb { visibility: visible; }
.fl::after { content: ""; position: absolute; left: 0; right: 0; top: calc(50% - .5px); height: 1px; background: var(--gap); z-index: 4; }
.fl::before { content: ""; position: absolute; top: calc(50% - .04em); left: -.02em; width: .08em; height: .08em; border-radius: 50%; background: var(--gap);
  box-shadow: calc(.62em - .04em) 0 0 var(--gap); z-index: 5; }
.fl.colon::before { box-shadow: none; left: 50%; }
.fl.colon > i::before { color: var(--chalk-dim); }
.fl.dim > i::before { color: var(--chalk-dim); }
.b-line { max-width: 1240px; margin: 0 auto; padding: 0 20px 16px; }
.b-line .flaps { max-width: 100%; overflow: hidden; }
.b-line .fl .t, .b-line .fl .ft { background: linear-gradient(180deg, var(--board-hi), color-mix(in srgb, var(--board-hi) 70%, var(--board))); }

/* The edge of the platform: its colour is the state of the day, readable from across the room. */
.platform { height: 6px; background-color: var(--mood); position: relative; overflow: hidden; }
.platform[data-mood="stop"] { background-image: repeating-linear-gradient(135deg, var(--gold) 0 8px, var(--board) 8px 16px); }
.platform::after { content: ""; position: absolute; top: 0; bottom: 0; width: 38%; left: -45%; opacity: 0;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .85), transparent); }
.platform.ceremony::after { animation: sweep 2.2s var(--ease) 1; }
@keyframes sweep { 0% { left: -45%; opacity: .9; } 100% { left: 110%; opacity: 0; } }

/* ---- Bar: sections and controls */
header.top { position: sticky; top: 0; z-index: 2; background: var(--paper);
  border-bottom: 1px solid var(--line); }
.top-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; max-width: 1240px; margin: 0 auto; padding: 0 20px; }
.brand { font: 600 18px var(--display); padding: 12px 0; letter-spacing: .02em; }
nav.tabs { display: flex; gap: 4px; position: relative; }
.tab-ink { position: absolute; left: 0; bottom: 0; width: 0; height: 3px; background: var(--track); pointer-events: none;
  transition: transform .34s var(--ease), width .34s var(--ease); }
nav.tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 13px 12px 10px;
  font: 600 16px var(--display); color: var(--muted); cursor: pointer; display: inline-flex; gap: 8px; align-items: baseline; }
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-selected="true"] { color: var(--ink); }
nav.tabs button.pop .count { animation: pop .32s var(--ease) 1; }
.count { font: 600 13px var(--display); min-width: 22px; text-align: center; padding: 0 6px; border-radius: 10px;
  background: var(--paper); color: var(--ink); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.count.hot { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
#controls { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-left: auto; padding: 8px 0; }

main { max-width: 1240px; margin: 0 auto; padding: 28px 20px 90px; background: var(--paper); }
@media (max-width: 700px) {
  header.top { position: static; }
  .top-in { padding: 0 12px; gap: 0 12px; }
  .brand { padding: 10px 0 0; }
  nav.tabs { order: 3; width: 100%; overflow-x: auto; }
  nav.tabs button { flex: 1 0 auto; justify-content: center; padding: 10px 6px 8px; font-size: 14px; gap: 4px; }
  #controls { margin-left: 0; padding: 4px 0 10px; width: 100%; }
  main { padding: 18px 12px 60px; }
  .detail { padding: 14px; }
  .board-in { padding: 12px 12px 8px; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .b-clock { display: none; }
  .b-info { justify-self: start; gap: 6px; padding-bottom: 0; font-size: 11px; }
  .b-counters { flex-wrap: nowrap; gap: 8px 14px; justify-content: space-between; }
  .plate { font-size: 10px; letter-spacing: .08em; }
  .flaps.big, .flaps.mid { font-size: 34px; }
  .flaps.small { font-size: 12px; }
  .b-line { padding: 0 12px 12px; }
}

/* ---- Buttons and chips */
button { font: inherit; color: inherit; background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; cursor: pointer;
  transition: border-color .15s, background-color .15s, transform .15s var(--ease); }
button:hover:not(:disabled) { border-color: var(--ink); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); font-weight: 600; }
button.danger { color: var(--bad); border-color: var(--bad); }
button.link { border: 0; background: none; padding: 0; color: inherit; text-align: left; font-weight: 600; }
button.link:hover { text-decoration: underline; }
.chip { display: inline-block; padding: 0 8px; border-radius: 4px; border: 1px solid var(--line); font-size: 13px; line-height: 20px; white-space: nowrap; }
.chip.turn { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-weight: 700; }
.chip.check { border: 1px dashed var(--gold); background: var(--gold-soft); }
.chip.wait { border-color: var(--track); color: var(--track); }
.chip.late { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); font-weight: 700; }
.chip.good { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 700; }
.chip.late::before { content: "! "; }
.chip.good::before { content: "\2713  "; }
.badge { display: inline-block; padding: 0 8px; border-radius: 10px; border: 1px solid var(--line); font-size: 13px; line-height: 20px; }
.badge.ok { color: var(--ok); border-color: var(--ok); }
.badge.bad { color: var(--bad); border-color: var(--bad); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.between { justify-content: space-between; }

/* ---- Hoy */
.hoy { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px 48px; align-items: start; }
@media (max-width: 1000px) { .hoy { grid-template-columns: minmax(0, 1fr); } }
/* The ticket and the list share the left column; the decisions take the right one from the top. */
.hoy h2 { font-size: 22px; }
@media (min-width: 1001px) {
  .hoy { grid-template-rows: auto 1fr; }
  .hoy > :nth-child(1) { grid-column: 1; grid-row: 1; }
  .hoy > :nth-child(2) { grid-column: 1; grid-row: 2; }
  .hoy > :nth-child(3) { grid-column: 2; grid-row: 1 / span 2; }
}
.hoy > :nth-child(3) > section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px 12px; }
.hoy > :nth-child(3) > .block { margin-top: 16px; }
.lead { font: 600 15px var(--display); color: var(--muted); margin-top: 6px; text-wrap: balance; }
.block { margin-top: 30px; }
.block > h3 { padding-bottom: 8px; border-bottom: 2px solid var(--ink); display: flex; gap: 10px; align-items: baseline; }
.block > h3 .count { align-self: center; }
.items { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 0 14px; padding: 12px 0; border-bottom: 1px solid var(--line-soft); align-items: start; }
.item::before { content: ""; align-self: stretch; border-radius: 3px; background: var(--line); }
.item.now::before { background: var(--gold); }
.item.late::before { background: var(--bad); }
.item.plain { grid-template-columns: minmax(0, 1fr) auto; }
.item.plain::before { display: none; }
.item.stack { grid-template-columns: minmax(0, 1fr); }
.item.next .item-title::after { content: "  \00B7  en el ticket"; font-weight: 500; font-size: 12px; color: var(--muted); }
.act-row { margin-top: 6px; gap: 8px 14px; }
.item-main { display: grid; gap: 3px; min-width: 0; }
.item-title { font-weight: 600; overflow-wrap: anywhere; }
.item-side { display: grid; gap: 6px; justify-items: end; text-align: right; }
.when { font: 600 15px var(--cond); font-variant-numeric: tabular-nums; white-space: nowrap; }
.when.late { color: var(--bad); }
.when.soon { color: var(--gold-ink); background: var(--gold); padding: 0 8px; border-radius: 4px; }
.group { border-bottom: 1px solid var(--line); }
.group > summary { cursor: pointer; padding: 11px 0; font: 600 16px var(--display); display: flex; gap: 10px; align-items: center; list-style: none; }
.group > summary::-webkit-details-marker { display: none; }
.group > summary::before { content: "+"; width: 18px; color: var(--muted); }
.group[open] > summary::before { content: "\2212"; }
.group > .items { padding-bottom: 8px; }
.group .item { padding: 9px 0; }
.fold { margin-top: 4px; }
.fold > summary { cursor: pointer; color: var(--track); font-size: 13px; }
pre.wrap { white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; background: var(--paper);
  border: 1px solid var(--line); border-radius: 4px; padding: 8px; font: 13px/1.45 var(--body); margin: 6px 0 0; }
.mail { padding: 10px 0; border-bottom: 1px solid var(--line-soft); display: grid; gap: 2px; }
.empty { padding: 14px 0; color: var(--muted); }
.fresh { animation: fresh 2.6s var(--ease) 1; }
@keyframes fresh { 0% { background-color: color-mix(in srgb, var(--track) 24%, transparent); } 100% { background-color: transparent; } }

/* ---- The ticket: the one thing to do now. Its colour says what kind of ask it is (gold: your
   move, teal: the bot waits for your stamp, red: late or stuck), and doing it punches it. */
.ticket-slot { margin: 22px 0 6px; min-height: 0; }
.ticket-wrap { filter: drop-shadow(0 10px 16px var(--shade)); }
.ticket { --tk: var(--gold-soft); --tk-ink: var(--gold-text); --stub: 150px; position: relative; display: grid; grid-template-columns: var(--stub) minmax(0, 1fr);
  color: var(--tk-ink); border-radius: 14px; overflow: hidden;
  -webkit-mask: radial-gradient(circle 10px at var(--stub) 0, transparent 97%, #000) top / 100% 51% no-repeat, radial-gradient(circle 10px at var(--stub) 100%, transparent 97%, #000) bottom / 100% 51% no-repeat;
  mask: radial-gradient(circle 10px at var(--stub) 0, transparent 97%, #000) top / 100% 51% no-repeat, radial-gradient(circle 10px at var(--stub) 100%, transparent 97%, #000) bottom / 100% 51% no-repeat; }
.ticket[data-tone="approve"] { --tk: var(--track-soft); --tk-ink: var(--track-ink); }
.ticket[data-tone="late"] { --tk: var(--bad-soft); --tk-ink: var(--ink); }
.ticket[data-tone="late"] .t-kind, .ticket[data-tone="late"] .t-when { color: var(--bad); }
.ticket-stub, .ticket-body { background: var(--tk); }
.ticket-stub { position: relative; padding: 16px 16px 14px; display: grid; align-content: space-between; gap: 8px; min-height: 150px; }
.ticket-stub::after { content: ""; position: absolute; right: 0; top: 14px; bottom: 14px; border-right: 2px dashed color-mix(in srgb, var(--tk-ink) 38%, transparent); }
.t-kind { font: 600 14px var(--display); }
.t-when { font: 700 44px/1 var(--cond); font-variant-numeric: tabular-nums; letter-spacing: .01em; overflow-wrap: anywhere; }
.t-when.small-text { font-size: 32px; letter-spacing: 0; }
.t-sub { font-size: 13px; opacity: .92; }
.ticket-body { padding: 16px 22px 14px 24px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.t-title { font: 600 28px/1.15 var(--display); overflow-wrap: anywhere; text-wrap: balance; }
.t-title button.link { font: inherit; }
.t-why { font-size: 15px; opacity: .94; overflow-wrap: anywhere; }
.t-acts { margin-top: 4px; }
.ticket button { background: color-mix(in srgb, var(--tk-ink) 7%, transparent); border-color: color-mix(in srgb, var(--tk-ink) 45%, transparent); color: var(--tk-ink); }
.ticket button:hover:not(:disabled) { border-color: var(--tk-ink); background: color-mix(in srgb, var(--tk-ink) 14%, transparent); }
.ticket button.primary { background: var(--tk-ink); color: var(--tk); border-color: var(--tk-ink); }
.ticket button.ghost { background: none; border-color: transparent; text-decoration: underline; padding-left: 4px; padding-right: 4px; }
.t-after { margin-top: auto; padding-top: 8px; font-size: 13px; opacity: .92; border-top: 1px solid color-mix(in srgb, var(--tk-ink) 18%, transparent); }
.t-link { align-self: center; font-size: 14px; color: var(--tk-ink); }
.ticket-clear { display: flex; gap: 18px; align-items: center; padding: 22px 24px; border: 2px dashed var(--line); border-radius: 14px; background: var(--surface); }
.clear-mark { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 4px solid var(--ok); position: relative; }
.clear-mark::after { content: ""; position: absolute; left: 12px; top: 5px; width: 11px; height: 20px; border: solid var(--ok); border-width: 0 4px 4px 0; transform: rotate(40deg); }
.clear-title { font: 600 22px var(--display); }
.punch { position: absolute; left: calc(var(--stub) / 2 - 11px); top: 50%; width: 22px; height: 22px; margin-top: -11px; border-radius: 50%; background: var(--paper);
  box-shadow: inset 0 2px 3px rgba(0, 0, 0, .35); transform: scale(0); z-index: 2; }
.ticket.punched .punch { animation: punch .26s var(--ease) forwards; }
.ticket.punched { animation: press .26s var(--ease); }
.ticket-wrap { transform: perspective(1100px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .18s ease-out; }
.ticket::before { content: none; }
.ticket-wrap.in { animation: ticket-in .42s var(--ease) 1; }
.ticket-wrap.out { animation: ticket-out .24s ease-in forwards; }
@keyframes punch { 0% { transform: scale(0); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes press { 40% { transform: translateY(2px) scale(.995); } }
@keyframes ticket-in { from { transform: translateX(34px) rotate(.8deg); opacity: 0; } }
@keyframes ticket-out { to { transform: translateX(-46px) rotate(-.8deg); opacity: 0; } }
@media (max-width: 700px) {
  .ticket { --stub: 96px; }
  .t-when { font-size: 32px; }
  .t-when.small-text { font-size: 19px; }
  .plan { overflow-x: auto; padding-bottom: 6px; }
  .plan-in { min-width: 760px; }
  .t-title { font-size: 20px; }
  .ticket-body { padding: 14px 14px 12px 16px; }
}

/* ---- Procesos */
.plan { margin-top: 6px; }
.plan svg { display: block; width: 100%; height: auto; overflow: visible; }
.line { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: 2px; }
.station { text-align: center; padding: 0 4px; min-width: 0; }
.station-n { font: 700 46px/1 var(--cond); font-variant-numeric: tabular-nums; }
.station-l { font: 600 15px var(--display); }
.station-c { color: var(--muted); font-size: 13px; min-height: 20px; }
.station.empty-stop .station-n { color: var(--muted); opacity: .55; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 6px; }
@media (max-width: 700px) { .filters { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; } .filters button { flex: none; } }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.grid-head, .proc { display: grid; grid-template-columns: minmax(180px, 1.5fr) 150px 112px minmax(130px, 1fr) minmax(190px, 1.4fr) 112px;
  gap: 4px 16px; align-items: center; padding-left: 12px; }
.grid-head { padding: 8px 0 8px 12px; border-bottom: 2px solid var(--ink); font: 600 14px var(--display); color: var(--muted); }
.proc { padding-top: 11px; padding-bottom: 11px; border-bottom: 1px solid var(--line-soft); }
.proc.mine { background: linear-gradient(90deg, var(--gold-soft), transparent 28%); box-shadow: inset 4px 0 0 var(--gold); }
.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.proc-name { display: grid; gap: 1px; min-width: 0; }
.proc-name .small { overflow-wrap: anywhere; }
.steps { display: flex; gap: 5px; align-items: center; }
.step { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--track-soft); background: var(--surface); }
.step.done { background: var(--track); border-color: var(--track); }
.step.here { background: var(--surface); border-color: var(--track); box-shadow: 0 0 0 3px var(--track-soft); }
.step-label { font-size: 13px; color: var(--muted); }
.since { display: flex; align-items: center; gap: 8px; }
.since.stale { color: var(--bad); font-weight: 600; }
.ring { width: 22px; height: 22px; flex: none; }
.ring circle { fill: none; stroke-width: 3.2; }
.ring .rt { stroke: var(--line); }
.ring .rv { stroke: var(--track); stroke-linecap: round; transition: stroke-dashoffset .9s var(--ease); }
.ring.warm .rv { stroke: var(--gold); }
.ring.hot .rv { stroke: var(--bad); }
@media (max-width: 980px) {
  .grid-head { display: none; }
  .proc { grid-template-columns: minmax(0, 1fr) auto; }
  .proc > :nth-child(n+3) { grid-column: 1 / -1; }
}
/* the live map of cars */
.car rect { fill: var(--track-soft); stroke: var(--track); stroke-width: 1.5; }
.car text { font: 700 14px var(--cond); fill: var(--track-ink); letter-spacing: .04em; pointer-events: none; }
.car.mine rect { fill: var(--gold); stroke: var(--gold); }
.car.mine text { fill: var(--gold-ink); }
.car.check rect { fill: var(--surface); stroke: var(--gold); stroke-width: 2; stroke-dasharray: 4 3; }
.car.check text { fill: var(--ink); }
.car.ghost rect { fill: var(--surface); stroke: var(--muted); stroke-dasharray: 3 3; }
.car.ghost text { fill: var(--muted); }
.car .late-dot { fill: var(--bad); stroke: var(--surface); stroke-width: 2; }
.car { cursor: pointer; outline: none; }
.car:focus-visible rect, .car:hover rect { stroke-width: 3; }
.map-label { font: 600 12px var(--cond); fill: var(--muted); letter-spacing: .04em; }
.map-track { stroke: var(--track); stroke-width: 4; stroke-linecap: butt; }
.map-river { fill: url(#river-g); }
.rg-a { stop-color: var(--track); stop-opacity: .38; }
.rg-b { stop-color: var(--ok); stop-opacity: .5; }
.map-flow { stroke: var(--paper); stroke-opacity: .7; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 1 15; animation: flow 2.6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -32; } }
body.away .map-flow { animation: none; }
.car .wheel { fill: var(--ink); opacity: .55; }
.map-stop { fill: var(--surface); stroke: var(--track); stroke-width: 4.5; }
.map-stop.off { stroke: var(--track-soft); }
.map-num { font: 700 12px var(--cond); fill: var(--track-ink); text-anchor: middle; }
.map-siding { stroke: var(--muted); stroke-width: 2.5; stroke-dasharray: 5 4; fill: none; }
.map-legend { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center; }
.sw { display: inline-block; width: 22px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1.5px solid var(--track); background: var(--track-soft); }
.sw.mine { background: var(--gold); border-color: var(--gold); }
.sw.check { background: var(--surface); border: 2px dashed var(--gold); }
.sw.ghost { background: var(--surface); border: 1.5px dashed var(--muted); }
.map-rail { stroke: var(--track); stroke-opacity: .45; stroke-width: 2; stroke-linecap: round; }
.map-yard { stroke: var(--track); stroke-opacity: .45; stroke-width: 2; }
.car.fresh rect { animation: carpulse 1.4s var(--ease) 3; }
@keyframes carpulse { 50% { stroke-width: 5; filter: brightness(1.25); } }

/* ---- Cola, listas */
.queue-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); align-items: baseline; }
.score { font: 700 22px var(--cond); font-variant-numeric: tabular-nums; color: var(--muted); }

/* ---- Detalle */
.detail { display: none; position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100vw); overflow: auto; outline: none;
  background: var(--surface); border-left: 1px solid var(--line); padding: 20px; z-index: 3; box-shadow: -18px 0 40px -24px var(--shade);
  view-transition-name: drawer; }
.detail.open { display: block; }
@supports not (view-transition-name: none) { .detail.open { animation: drawer .28s var(--ease); } }
@keyframes drawer { from { transform: translateX(28px); opacity: 0; } }
.detail h2 { font-size: 22px; }
.detail h3 { margin: 22px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); font-size: 16px; }
.detail ul { margin: 0; padding-left: 20px; }
.detail li { margin: 3px 0; }
img.shot { max-width: 100%; border: 1px solid var(--line); border-radius: 4px; }
input[type="text"], textarea, select { font: inherit; color: inherit; background: var(--paper); border: 1px solid var(--line);
  border-radius: 6px; padding: 7px 9px; width: 100%; max-width: 560px; }
select { width: auto; }
table { border-collapse: collapse; }
td { padding: 2px 14px 2px 0; }

/* ---- Aprender */
.learn { max-width: 760px; }
.question { font: 600 22px/1.35 var(--display); }
.card-q { perspective: 900px; background: var(--raise); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px;
  box-shadow: 0 18px 34px -24px var(--shade), inset 4px 0 0 var(--track); }
.card-q .question { font-size: 26px; margin: 6px 0 14px; }
.card-q textarea { max-width: none; }
#answer { border-left: 4px solid var(--track); background: var(--track-soft); color: var(--ink); font-size: 14px; }
button[data-grade] { min-width: 44px; font-weight: 700; font-family: var(--cond); font-size: 18px; border-width: 2px; border-color: var(--g); background: color-mix(in srgb, var(--g) 14%, var(--raise)); }
button[data-grade="0"] { --g: var(--muted); } button[data-grade="1"] { --g: color-mix(in srgb, var(--track) 22%, var(--muted)); }
button[data-grade="2"] { --g: color-mix(in srgb, var(--track) 44%, var(--muted)); } button[data-grade="3"] { --g: color-mix(in srgb, var(--track) 66%, var(--muted)); }
button[data-grade="4"] { --g: color-mix(in srgb, var(--track) 86%, var(--muted)); } button[data-grade="5"] { --g: var(--track); }
#answer { transform-origin: 50% 0; animation: unfold .45s var(--ease) 1; }
@keyframes unfold { from { transform: rotateX(-75deg); opacity: 0; } }

.fatal { padding: 24px 0; color: var(--bad); font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: 90vw; padding: 9px 16px;
  border-radius: 6px; background: var(--ink); color: var(--surface); opacity: 0; pointer-events: none; transform: translate(-50%, 14px);
  transition: opacity .2s, transform .28s var(--ease); z-index: 4; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: var(--bad); color: var(--on-bad); }

/* ---- The command palette */
.kbd-btn { display: inline-flex; gap: 8px; align-items: center; padding: 3px 10px; font-size: 13px; color: var(--muted); }
.kbd-btn kbd { font: 600 11px var(--cond); letter-spacing: .06em; padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); color: var(--muted); }
.pal-back { position: fixed; inset: 0; z-index: 6; display: grid; justify-items: center; align-content: start; padding: 13vh 14px 0;
  background: color-mix(in srgb, var(--gap) 62%, transparent); animation: pal-fade .16s ease-out; }
.pal { width: min(640px, 100%); background: var(--raise); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
  box-shadow: 0 30px 70px -20px var(--shade); animation: pal-in .2s var(--ease); }
.pal input { display: block; width: 100%; max-width: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: none; padding: 17px 20px; font-size: 18px; }
.pal input:focus-visible { outline: none; box-shadow: inset 0 -3px 0 var(--track); }
.pal-list { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow: auto; }
.pal-item { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 9px 12px; border-radius: 9px; cursor: pointer; }
.pal-item.on { background: var(--track-soft); box-shadow: inset 3px 0 0 var(--track); }
.pal-kind { font: 600 12px var(--cond); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pal-text { font-weight: 600; overflow-wrap: anywhere; }
.pal-extra { font-size: 12px; color: var(--muted); }
.pal-empty { padding: 16px 12px; color: var(--muted); }
.pal-foot { padding: 8px 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); background: var(--surface); }
@keyframes pal-fade { from { opacity: 0; } }
@keyframes pal-in { from { transform: translateY(-10px) scale(.98); opacity: 0; } }
@media (max-width: 700px) { .kbd-btn kbd, #open-keys { display: none; } .pal-item { grid-template-columns: minmax(0, 1fr); gap: 2px; } }

/* ---- Moving between things. The board stays put; a section slides the way you went (Hoy to Procesos is forward);
   the drawer grows out of the row you opened and leaves back into it; lists glide to their new order. The
   browser does the heavy lifting (view transitions) and the page works exactly the same without them. */
::view-transition { pointer-events: none; }
::view-transition-group(root) { animation: none; }
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
main { view-transition-name: page; }
::view-transition-group(page) { animation-duration: 0s; }
::view-transition-old(page), ::view-transition-new(page) { animation: none; mix-blend-mode: normal; }
[data-vt="sun"]::view-transition-new(page) { animation: sun-in .74s var(--ease-expo) both; }
[data-vt="sun"]::view-transition-old(page) { animation: sun-old .74s var(--ease-expo) both; }
/* Moving along the line: the page slides toward the stop you chose and turns a little as it leaves, the way the
   panel did in the story. Two or three stops away is a longer ride. */
[data-vt="fwd"] { --vt-dir: 1; }
[data-vt="back"] { --vt-dir: -1; }
[data-vt="fwd"]::view-transition-old(page), [data-vt="back"]::view-transition-old(page) { animation: travel-out var(--vt-time, .62s) var(--ease-expo) both; }
[data-vt="fwd"]::view-transition-new(page), [data-vt="back"]::view-transition-new(page) { animation: travel-in var(--vt-time, .62s) var(--ease-expo) both; }
@keyframes travel-out { to { opacity: 0; transform: perspective(1500px) translateX(calc(var(--vt-dir, 1) * -9%)) rotateY(calc(var(--vt-dir, 1) * 10deg)) scale(.95); } }
@keyframes travel-in { from { opacity: 0; transform: perspective(1500px) translateX(calc(var(--vt-dir, 1) * 9%)) rotateY(calc(var(--vt-dir, 1) * -10deg)) scale(.95); } }
.platform .rider { position: absolute; top: 0; bottom: 0; left: 0; width: 56px; border-radius: 3px; background: var(--chalk); opacity: 0; pointer-events: none; }
@keyframes sun-in { from { clip-path: circle(0 at var(--vt-x, 50%) var(--vt-y, 0)); } to { clip-path: circle(var(--vt-r, 160vmax) at var(--vt-x, 50%) var(--vt-y, 0)); } }
@keyframes sun-old { to { transform: scale(.985); opacity: .45; } }
::view-transition-old(drawer):only-child { animation: drawer-out .22s ease-in both; }
::view-transition-new(drawer):only-child { animation: drawer-in .36s var(--ease) both; }
::view-transition-group(drawer) { animation-duration: .3s; animation-timing-function: var(--ease); }
[data-vt="next"]::view-transition-old(drawer) { animation: vt-out .14s ease-in both; }
[data-vt="next"]::view-transition-new(drawer) { animation: vt-in .3s var(--ease) both; }
[data-vt="prev"]::view-transition-old(drawer) { animation: vt-out-r .14s ease-in both; }
[data-vt="prev"]::view-transition-new(drawer) { animation: vt-in-r .3s var(--ease) both; }
::view-transition-group(job) { animation-duration: .42s; animation-timing-function: var(--ease); z-index: 1; }
::view-transition-old(job), ::view-transition-new(job) { height: 100%; width: 100%; object-fit: none; object-position: left center; }
@keyframes vt-out { to { opacity: 0; transform: translateX(-26px); } }
@keyframes vt-in { from { opacity: 0; transform: translateX(26px); } }
@keyframes vt-out-r { to { opacity: 0; transform: translateX(26px); } }
@keyframes vt-in-r { from { opacity: 0; transform: translateX(-26px); } }
@keyframes drawer-out { to { opacity: 0; transform: translateX(44px); } }
@keyframes drawer-in { from { opacity: 0; transform: translateX(44px); } }
@keyframes pop { 40% { transform: scale(1.28); } }
/* where you are: the row the keyboard is on, the thing you were sent to, and what a car and its row share */
li[data-card], li[data-task], section, .ticket-wrap { scroll-margin: 96px 0 28px; }
li.cur { background: color-mix(in srgb, var(--track) 12%, transparent); box-shadow: inset 4px 0 0 var(--track); }
.locate { animation: locate 1.6s var(--ease) 1; border-radius: 10px; }
@keyframes locate { 0%, 40% { outline: 3px solid var(--track); outline-offset: 6px; } 100% { outline: 3px solid transparent; outline-offset: 14px; } }
.proc.hl { background: color-mix(in srgb, var(--track) 11%, transparent); }
.car.hl rect { stroke-width: 3.5; filter: brightness(1.18); }
.b-group[role="button"] { cursor: pointer; border-radius: 8px; padding: 4px 6px 6px; margin: -4px -6px -6px; transition: background-color .15s; }
.b-group[role="button"]:hover { background: rgba(255, 255, 255, .06); }
.b-group[role="button"]:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }
.seq { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.seq button { padding: 2px 9px; }
.timeline { list-style: none; margin: 0; padding: 2px 0 2px 18px; border-left: 2px solid var(--track-soft); }
.timeline li { position: relative; display: grid; gap: 1px; padding: 6px 0 8px; margin: 0; }
.timeline li::before { content: ""; position: absolute; left: -25px; top: 11px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 3px solid var(--track); }
.timeline li:first-child::before { background: var(--ink); border-color: var(--ink); }
.bars { display: grid; gap: 2px; }
.bar-row { display: grid; grid-template-columns: minmax(110px, 1.3fr) 2fr 38px; gap: 12px; align-items: center; padding: 3px 0; }
.bar-t { display: block; height: 9px; border-radius: 5px; background: var(--line-soft); overflow: hidden; }
.bar-t i { display: block; height: 100%; width: calc(var(--w, 0) * 100%); border-radius: 5px; background: var(--track); transform-origin: 0 50%; animation: grow .7s var(--ease) both; }
.bar-v { font: 700 16px var(--cond); text-align: right; }
@keyframes grow { from { transform: scaleX(0); } }
.keys { position: fixed; left: 16px; bottom: 16px; z-index: 5; width: min(360px, calc(100vw - 32px)); padding: 14px 16px; border-radius: 12px;
  background: var(--raise); border: 1px solid var(--line); box-shadow: 0 22px 50px -18px var(--shade); animation: pal-in .2s var(--ease); }
.keys h3 { font-size: 15px; margin-bottom: 8px; }
.keys dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.keys dt kbd { font: 600 12px var(--cond); padding: 1px 7px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); }
.keys dd { margin: 0; color: var(--muted); }

/* ---- One app, one way of moving: the same gestures as the story that introduces it. A section opens as a
   sun; its title rises out of its baseline; what it lists comes in one after another; the funnel draws itself and
   counts; an approval fills, then confirms in green. All of it plays only when you change section, never on
   the silent refresh, and none of it when the system asks for less motion. */
@property --n { syntax: "<integer>"; inherits: true; initial-value: 0; }
#app.entering h2 { animation: title-rise .8s var(--ease-expo) .06s both; }
#app.entering :is(.ticket-wrap, .lead, li.item, li.proc, li.queue-row, .mail, .station, .block > h3, .card-q, .ticket-clear) {
  animation: row-in .55s var(--ease) calc(var(--i, 0) * 30ms + .16s) both; }
@keyframes title-rise { from { transform: translateY(100%); clip-path: inset(0 0 100% 0); } to { transform: translateY(0); clip-path: inset(0 0 0 0); } }
@keyframes row-in { from { opacity: 0; transform: translateY(12px); } }
#app.entering .station-n { position: relative; color: transparent; }
#app.entering .station-n::after { content: counter(n); counter-reset: n var(--n); position: absolute; inset: 0; color: var(--ink);
  animation: count-up 1.05s var(--ease-expo) .3s both; }
#app.entering .station.empty-stop .station-n::after { color: var(--muted); }
@keyframes count-up { from { --n: 0; } }
button.sending, button.sent { position: relative; overflow: hidden; }
button.sending:disabled, button.sent:disabled { opacity: 1; }
button.sending::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--gold); transform-origin: 0 50%;
  animation: send-bar 1.1s var(--ease) infinite; }
@keyframes send-bar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
button.sent { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
button.sent::before { content: "\2713  "; }

/* ---- The story's ideas, as views you use: what jobbot did in the last day (Hoy), the path from a posting to a send,
   the threshold and trust (Cola), and where one application stands among the five layers (the drawer). The same
   words as the story, the same colours as everywhere: gold is your turn, blue is the way, green is confirmed. */
.night-plot { position: relative; margin-top: 12px; }
.night-svg { display: block; width: 100%; height: auto; overflow: visible; }
.n-hatch { stroke: var(--line); stroke-width: 2; }
.n-busy { fill: url(#night-hatch); }
.n-base { stroke: var(--line); stroke-width: 2; }
.n-bar { fill: var(--track); }
.n-now { stroke: var(--ink); stroke-width: 2; }
.n-dot { cursor: pointer; }
.n-dot circle { fill: var(--surface); stroke: var(--track); stroke-width: 3.5; transform-box: fill-box; transform-origin: center; }
.n-dot.ask circle { fill: var(--gold); stroke: var(--gold); }
.n-dot.sent circle { fill: var(--ok); stroke: var(--ok); }
.n-dot:hover circle { stroke: var(--ink); }
.n-axis { position: relative; height: 20px; margin-top: 6px; }
.n-axis span { position: absolute; top: 0; transform: translateX(-50%); font: 600 12px var(--cond); letter-spacing: .04em; color: var(--muted); white-space: nowrap; }
.n-axis span.now { color: var(--ink); font-weight: 700; }
.n-axis span.edge-r { transform: translateX(-100%); }
.n-sub { font: 500 14px var(--display); color: var(--muted); }
.n-list .n-li { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line-soft); }
.sw.bar { background: var(--track); border-color: var(--track); width: 14px; }
.sw.dot, .sw.dot-ask, .sw.dot-sent { width: 12px; border-radius: 50%; border: 3px solid var(--track); background: var(--surface); }
.sw.dot-ask { background: var(--gold); border-color: var(--gold); }
.sw.dot-sent { background: var(--ok); border-color: var(--ok); }
.sw.hatch { border: 1.5px solid var(--line); background: repeating-linear-gradient(135deg, var(--line) 0 2px, transparent 2px 6px); }

.route-river { fill: url(#route-g); }
.cola-pair { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 0 44px; align-items: start; }
@media (max-width: 900px) { .cola-pair { grid-template-columns: minmax(0, 1fr); } }
.thr-plot { position: relative; margin-top: 8px; padding: 24px 0 24px; }
.thr-svg { display: block; width: 100%; height: 112px; overflow: visible; }
.h-bar { fill: var(--line); }
.h-bar.in { fill: var(--track); }
.h-thr { stroke: var(--ink); stroke-width: 2; vector-effect: non-scaling-stroke; }
.h-if { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
.thr-axis span { position: absolute; bottom: 0; transform: translateX(-50%); font: 600 12px var(--cond); letter-spacing: .04em; color: var(--muted); white-space: nowrap; }
.thr-axis span.tag { color: var(--ink); font-weight: 700; }
.thr-note { position: absolute; top: 2px; font: 700 15px var(--cond); letter-spacing: .02em; white-space: nowrap; pointer-events: none; }
.thr-note.in { color: var(--track-ink); }
.thr-note.out { color: var(--muted); transform: translateX(-100%); }
.thr-try { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 6px; }
.thr-try input[type="range"] { flex: 1 1 200px; max-width: 360px; accent-color: var(--track); }
.thr-try output { font: 700 20px var(--cond); min-width: 2ch; }
.t-boxes { list-style: none; display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 4px; padding: 0; }
.t-box { width: 44px; height: 44px; border-radius: 8px; border: 2px dashed var(--line); display: grid; place-items: center; font: 700 22px var(--cond); color: var(--muted); }
.t-box::before { content: attr(data-n); }
.t-box.done { border: 2px solid var(--ok); background: var(--ok-soft); color: var(--ok); }
.t-box.done::before { content: "\2713"; }
.cap { margin-top: 20px; }
.cap-label { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; margin-bottom: 6px; }
.cap-bar { height: 10px; border-radius: 5px; background: var(--line-soft); overflow: hidden; }
.cap-bar i { display: block; height: 100%; width: calc(var(--w, 0) * 100%); border-radius: 5px; background: var(--track); transform-origin: 0 50%; }
.mini { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 2px; }
.step.here.you { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }

.journey { list-style: none; margin: 6px 0 0; padding: 0; }
.journey li { position: relative; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 0 12px; padding: 0 0 16px; margin: 0; }
.journey li::before { content: ""; position: absolute; left: 12px; top: 26px; bottom: 0; width: 2px; background: var(--track-soft); }
.journey li:last-child { padding-bottom: 4px; }
.journey li:last-child::before { content: none; }
.journey li.j-done::before { background: var(--track); }
.j-mark { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 15px/1 var(--cond);
  border: 3px solid var(--track-soft); background: var(--surface); color: var(--muted); box-sizing: border-box; }
.j-done .j-mark { background: var(--track); border-color: var(--track); color: var(--paper); }
.j-done .j-mark::before { content: "\2713"; }
.j-robot .j-mark { border-color: var(--track); color: var(--track-ink); }
.j-robot .j-mark::before { content: "\2026"; }
.j-you .j-mark { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.j-you .j-mark::before { content: "!"; }
.j-name { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font: 600 16px var(--display); min-height: 26px; }
.j-todo .j-name { color: var(--muted); font-weight: 500; }
.j-body { display: grid; gap: 4px; min-width: 0; }
.j-after { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line-soft); display: grid; gap: 6px; }
.journey.enter li { animation: row-in .5s var(--ease) calc(var(--i, 0) * 70ms + .15s) both; }

@keyframes bar-up { from { transform: scaleY(0); } }
@keyframes dot-in { from { opacity: 0; transform: scale(.2); } }
@keyframes box-in { from { opacity: 0; transform: scale(.5); } }
#app.entering .n-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: bar-up .6s var(--ease) calc(var(--bi, 0) * 14ms + .22s) both; }
#app.entering .h-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: bar-up .6s var(--ease) calc(var(--bi, 0) * 7ms + .25s) both; }
