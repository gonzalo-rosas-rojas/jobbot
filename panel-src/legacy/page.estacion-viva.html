/* Movement is for what changed. Whoever asks for less gets none, and a hidden tab pays nothing. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
body.away .platform { animation: none; }
</style>
</head>
<body>
<section class="board" aria-label="Tablero de salidas">
  <div class="board-in">
    <div class="b-counters" id="b-counters" role="group" aria-label="Cuántas cosas esperan"></div>
    <div class="b-info" id="b-info"></div>
    <div class="b-clock" id="b-clock" aria-hidden="true"></div>
  </div>
  <div class="b-line" id="b-line" aria-hidden="true"></div>
  <p class="sr" id="b-line-sr" role="status"></p>
</section>
<div class="platform" id="platform" data-mood="calm" aria-hidden="true"></div>
<header class="top">
  <div class="top-in">
    <div class="brand">jobbot</div>
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button role="tab" id="tab-hoy" data-tab="hoy" aria-selected="true" aria-controls="app" tabindex="0">Hoy</button>
      <button role="tab" id="tab-procesos" data-tab="procesos" aria-selected="false" aria-controls="app" tabindex="-1">Procesos</button>
      <button role="tab" id="tab-cola" data-tab="cola" aria-selected="false" aria-controls="app" tabindex="-1">Cola</button>
      <button role="tab" id="tab-learn" data-tab="learn" aria-selected="false" aria-controls="app" tabindex="-1">Aprender</button>
    </nav>
    <div id="controls"></div>
  </div>
</header>
<main id="app" role="tabpanel" aria-labelledby="tab-hoy"><p class="muted">Cargando…</p></main>
<aside id="detail" class="detail" tabindex="-1" aria-label="Detalle de la postulación"></aside>
<div id="toast" class="toast" role="status"></div>
<script nonce="__NONCE__">
"use strict";
(() => {
  // The token arrives in the address, is read once and is taken out of the address bar.
  const params = new URLSearchParams(location.search);
  const token = params.get("t") || "";
  // Shown inside another page (the demo on a site), the panel leaves the browser history alone.
  const embedded = window.top !== window || params.has("embed");
  history.replaceState(null, "", location.pathname + location.hash);

  const STATE_LABELS = {
    scored: "Puntuada", prepared: "Preparada", needs_gonza: "Necesita a Gonza", submitted: "Enviada",
    replied: "Respondió", technical_test: "Prueba técnica", interview: "Entrevista", offer: "Oferta",
    accepted: "Aceptada", rejected: "Rechazada", withdrawn: "Retirada", ghosted: "Sin respuesta",
  };
  const MARK_LABELS = {
    replied: "Respondió", technical_test: "Prueba técnica", interview: "Entrevista", offer: "Oferta",
    accepted: "Aceptada", rejected: "Rechazada", withdrawn: "Retirada", ghosted: "Sin respuesta",
  };
  const ACTION_LABELS = { approve: "Aprobar", resolve: "Devolver a la cola", confirm: "Ya la envié" };
  const ACTION_HINTS = {
    approve: "Revisé la captura y está bien: la próxima corrida la envía.",
    resolve: "Arreglé lo que la detuvo; que vuelva a la cola.",
    confirm: "La envié yo o sí llegó; márcala como enviada.",
  };
  const KIND_LABELS = {
    ack: "Acuse", rejection: "Rechazo", recruiter: "Reclutador", interview_invite: "Invitación a entrevista",
    technical_test: "Prueba técnica", action_required: "Requiere acción", other: "Otro",
  };
  // The five stations every application goes through, left to right.
  const STATIONS = [
    { state: "submitted", label: "Enviada" },
    { state: "replied", label: "Respondió" },
    { state: "technical_test", label: "Prueba técnica" },
    { state: "interview", label: "Entrevista" },
    { state: "offer", label: "Oferta" },
  ];
  const LIVE = ["submitted", "replied", "technical_test", "interview", "offer", "ghosted"];
  const CLOSED = ["accepted", "rejected", "withdrawn"];
  // The kinds of "needs Gonza", in the order they are shown.
  const REASON_GROUPS = [
    { kind: "approve", title: "Por aprobar" },
    { kind: "handoff", title: "Formularios para enviar tú" },
    { kind: "missing_answers", title: "Faltan respuestas" },
    { kind: "blocked", title: "Una página me frenó" },
    { kind: "error", title: "La página falló" },
    { kind: "manual_apply", title: "Postular a mano desde el aviso" },
    { kind: "other", title: "Otras" },
  ];
  const STALE_DAYS = 10;
  const OPEN_BELOW = 7;
  const REDRAW_MS = 10 * 60 * 1000;

  const state = {
    snap: null, last: "", tab: "hoy", filter: "all", openKey: null, detail: null, shotUrl: null, shotKey: null, note: "",
    folds: {}, fresh: new Set(), skipped: new Set(), ticketId: null, hadTicket: false, punched: 0,
    rings: new Set(), carPos: new Map(), after: [], whatIf: null, journeyIn: false,
    scroll: {}, cursor: null, returnTo: null, drawerPushed: false, ignorePop: 0, vtBusy: false,
    drill: { card: null, shown: false, answer: "", text: "", topic: "", empty: false },
  };

  // Where Gonza was, kept for the visit (not for ever): the section, the filter and the folds he opened.
  const TABS = ["hoy", "procesos", "cola", "learn"];
  const FILTERS = ["all", "mine", "wait", "stale"];
  const keep = {
    get(name) { try { return JSON.parse(sessionStorage.getItem("panel." + name) || "null"); } catch (e) { return null; } },
    set(name, value) { try { sessionStorage.setItem("panel." + name, JSON.stringify(value)); } catch (e) { /* no storage */ } },
  };
  const persist = () => keep.set("view", { tab: state.tab, filter: state.filter, folds: state.folds });
  const startRoute = routeOfHash();
  const saved = embedded ? null : keep.get("view");
  if (saved && FILTERS.includes(saved.filter)) state.filter = saved.filter;
  if (saved && saved.folds && typeof saved.folds === "object") state.folds = saved.folds;
  if (startRoute) state.tab = startRoute.tab;
  else if (saved && TABS.includes(saved.tab)) state.tab = saved.tab;

  // Builds an element. Every child that is not a node becomes a text node, so data can never be
  // read as markup.
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [name, value] of Object.entries(attrs || {})) {
      if (value === false || value == null) continue;
      if (name === "class") el.className = value;
      else if (name.startsWith("on")) el.addEventListener(name.slice(2), value);
      else el.setAttribute(name, value === true ? "" : String(value));
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid === false || kid == null) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }

  // Replaces the children of a box with the parts that exist. `replaceChildren` would print a
  // missing part (a `null` from a condition) as the text "null".
  function fill(box, ...parts) {
    box.replaceChildren(...parts.filter((part) => part != null && part !== false));
  }

  // A button for something that cannot be undone. The first click only arms it and says so; a
  // second, deliberate click within a few seconds does the thing. Two clicks in the same instant
  // (a double click by habit) count as one, so that cannot confirm by accident.
  const ARM_MIN_MS = 350;
  const ARM_MAX_MS = 5000;
  function twoStep(label, run) {
    let armedAt = 0;
    let timer = 0;
    return (e) => {
      const button = e.currentTarget;
      if (armedAt === 0) {
        armedAt = Date.now();
        button.textContent = "¿Seguro? Pulsa otra vez";
        timer = setTimeout(() => { armedAt = 0; button.textContent = label; }, ARM_MAX_MS);
        return;
      }
      if (Date.now() - armedAt < ARM_MIN_MS) return;
      clearTimeout(timer);
      armedAt = 0;
      button.textContent = label;
      run(button);
    };
  }

  // A link only when the address is http or https.
  function link(url, text) {
    if (!/^https?:\/\//i.test(url || "")) return h("span", { class: "muted" }, text || url || "");
    return h("a", { href: url, target: "_blank", rel: "noopener noreferrer" }, text || url);
  }

  const pct = (x) => (x == null ? "n/a" : Math.round(x * 100) + "%");
  const usd = (x) => "US$" + Number(x).toFixed(2);
  function when(iso) {
    try {
      return new Date(iso).toLocaleString("es-CL", { timeZone: "America/Santiago", dateStyle: "short", timeStyle: "short" });
    } catch (e) {
      return iso;
    }
  }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

  // "hace 3 h", "hace 2 días": how long ago, in words.
  function ago(iso, nowMs) {
    const minutes = Math.floor((nowMs - Date.parse(iso)) / 60000);
    if (!(minutes >= 0)) return "ahora";
    if (minutes < 60) return "hace " + Math.max(minutes, 1) + " min";
    const hours = Math.floor(minutes / 60);
    if (hours < 48) return "hace " + hours + " h";
    return "hace " + Math.floor(hours / 24) + " días";
  }
  const daysSince = (iso, nowMs) => Math.max(0, Math.floor((nowMs - Date.parse(iso)) / 86400000));

  // The time left to a task, or how late it is, with a tone for the page to colour.
  function countdown(task, nowMs) {
    if (!task.due_at) return null;
    const ms = Date.parse(task.due_at) - nowMs;
    if (task.overdue || ms < 0) {
      const hours = Math.floor(-ms / 3600000);
      return { text: "Venció " + (hours < 48 ? "hace " + Math.max(hours, 1) + " h" : "hace " + Math.floor(hours / 24) + " días"), tone: "late" };
    }
    const hours = Math.floor(ms / 3600000);
    if (hours < 1) return { text: "Vence en menos de 1 h", tone: "soon" };
    if (hours < 48) return { text: "Vence en " + hours + " h", tone: "soon" };
    return { text: "Quedan " + Math.floor(hours / 24) + " días", tone: "" };
  }

  const toastBox = document.getElementById("toast");
  let toastTimer = 0;
  function toast(message, ok) {
    toastBox.textContent = message;
    toastBox.className = "toast show " + (ok ? "ok" : "bad");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastBox.className = "toast"; }, 6000);
  }

  // The static demo (docs/demo, made-up data) sets `window.__DEMO__`; the real panel never has it.
  const demo = window.__DEMO__ || null;
  async function api(path, body) {
    if (demo) return demo.api(path, body);
    const init = { headers: { "X-Panel-Token": token } };
    if (body !== undefined) {
      init.method = "POST";
      init.headers["Content-Type"] = "application/json";
      init.body = JSON.stringify(body);
    }
    let res;
    try {
      res = await fetch(path, init);
    } catch (e) {
      return { ok: false, status: 0, data: { message: "No se pudo hablar con el panel: ¿se cerró jobbot panel?" } };
    }
    let data = null;
    try { data = await res.json(); } catch (e) { /* not JSON */ }
    return { ok: res.ok, status: res.status, data };
  }

  const said = (r, fallback) => (r.data && r.data.message) || fallback;

  function fatal(message) {
    document.getElementById("app").replaceChildren(h("p", { class: "fatal" }, message));
    document.getElementById("controls").replaceChildren();
    document.getElementById("detail").className = "detail";
  }

  async function refresh(force) {
    const r = await api("/api/snapshot");
    if (r.status === 401 || r.status === 403) {
      fatal("El panel no reconoce este enlace: la clave cambia cada vez que se inicia jobbot panel. Ábrelo de nuevo con el enlace que imprime.");
      return false;
    }
    if (!r.ok) { toast(said(r, "No se pudo leer el panel."), false); return false; }
    const key = JSON.stringify(Object.assign({}, r.data, { generated_at: "" }));
    // Nothing changed, but the clock did: the countdowns, "hace 3 h" and the days without news are
    // worked out from the snapshot's own time, so an old picture is drawn again after a while.
    const aged = state.snap != null && Date.parse(r.data.generated_at) - Date.parse(state.snap.generated_at) >= REDRAW_MS;
    if (!force && key === state.last && !aged) return true;
    // Never redraw under a half-typed answer; the next poll tries again.
    if (!force && typing()) return true;
    state.last = key;
    const news = state.snap ? diffSnapshots(state.snap, r.data) : sinceLastVisit(r.data);
    state.snap = r.data;
    state.fresh = news.fresh;
    render();
    if (news.lines.length) announce(news.lines);
    if (news.big) ceremony();
    // The marks of what is new last a moment; a redraw after that does not point at them again.
    setTimeout(() => { state.fresh = new Set(); }, 4000);
    return true;
  }

  function typing() {
    const a = document.activeElement;
    return a != null && document.getElementById("app").contains(a) && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName);
  }

  // An action: the button is off while the request runs, then everything is read again.
  const SEQUENCE = { "/api/approve": "Aprobada", "/api/confirm": "Anotada" };
  async function act(path, body, button, onOk) {
    const staged = !!(button && SEQUENCE[path]) && !still();
    if (button) button.disabled = true;
    if (staged) button.classList.add("sending");
    const r = await api(path, body);
    toast(said(r, r.ok ? "Hecho." : "No se pudo."), r.ok);
    if (r.ok && onOk) onOk();
    if (staged) {
      button.classList.remove("sending");
      if (r.ok) {
        button.classList.add("sent");
        button.textContent = SEQUENCE[path];
        await new Promise((resolve) => setTimeout(resolve, 600));
      }
    }
    await refresh(true);
    if (state.openKey) await openJob(state.openKey);
    return r;
  }

  // ---- What the page knows about the processes, built from one snapshot

  const norm = (text) => String(text || "").toLowerCase();
  function escapeRegExp(text) { return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

  // The application a task belongs to: by its key when it has one, else by a company name that the
  // task text says out loud (whole word, at least three letters). A task that names several
  // companies belongs to none of them, so a to-do about a batch is never pinned on one process.
  function ownerOf(task, cards) {
    // A task with a key belongs to that application or to none: never to another one that happens
    // to share a company name.
    if (task.job_key) return cards.find((c) => c.key === task.job_key) || null;
    const text = norm(task.text);
    const named = cards.filter((c) => {
      const name = norm(c.company).trim();
      return name.length >= 3 && new RegExp("(^|[^\\p{L}\\p{N}])" + escapeRegExp(name) + "($|[^\\p{L}\\p{N}])", "u").test(text);
    });
    // Exactly one application named, or the text is about something else (a batch, two companies,
    // a company with two open applications) and no process is pinned.
    return named.length === 1 ? named[0] : null;
  }

  function model(s) {
    const nowMs = Date.parse(s.generated_at);
    const live = [];
    for (const col of s.board) if (LIVE.includes(col.state)) live.push(...col.cards);
    const tasks = s.today.tasks.map((task) => ({ task, owner: ownerOf(task, live) }));
    const nextByKey = new Map();
    for (const item of tasks) {
      if (item.owner && !nextByKey.has(item.owner.key)) nextByKey.set(item.owner.key, item.task);
    }
    const procs = live.map((card) => {
      const task = nextByKey.get(card.key) || null;
      let turn = "wait";
      if (task) turn = "mine";
      else if (card.state === "offer") turn = "mine";
      else if (card.state === "ghosted") turn = "check";
      else if (card.state !== "submitted") turn = "check";
      const days = daysSince(card.updated_at, nowMs);
      return { card, task, turn, days, stale: card.state === "submitted" && days >= STALE_DAYS };
    });
    // Whose turn first; inside a group the nearest deadline (none last), then the longest wait. Every
    // key is a plain number, so the order is the same whichever pair the sort compares.
    const rank = { mine: 0, check: 1, wait: 2 };
    const due = (p) => (p.task && p.task.due_at ? Date.parse(p.task.due_at) : Number.MAX_SAFE_INTEGER);
    procs.sort((a, b) => rank[a.turn] - rank[b.turn] || Math.sign(due(a) - due(b)) || b.days - a.days);
    return { nowMs, tasks, procs };
  }

  // ---- The board: split-flap counters, the line of announcements, the clock and the platform edge

  // A flap shows one letter at a time, and the drum turns forward only, so a change from 3 to 7
  // runs through 4, 5 and 6 like the real boards do.
  const DRUM = " 0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ:.-/+";
  const motion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const still = () => motion.matches || document.hidden;
  const flapText = (text) => String(text == null ? "" : text).normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().replace(/[^0-9A-Z:.\-/+ ]/g, " ");

  function paintCell(el, ch) {
    for (const part of el.children) part.setAttribute("data-c", ch);
    el._c = ch;
  }

  function flapCell(extra) {
    const el = h("span", { class: "fl" + (extra ? " " + extra : "") }, h("i", { class: "t" }), h("i", { class: "b" }), h("i", { class: "ft" }), h("i", { class: "fb" }));
    paintCell(el, " ");
    return el;
  }

  // One turn of the flap: the top half falls over the new letter, then the bottom half lands.
  function flipOnce(el, from, to, ms) {
    const [top, bottom, ft, fb] = el.children;
    top.setAttribute("data-c", to);
    bottom.setAttribute("data-c", from);
    ft.setAttribute("data-c", from);
    fb.setAttribute("data-c", to);
    el.classList.add("go");
    const down = ft.animate([{ transform: "rotateX(0deg)", filter: "brightness(1)" }, { transform: "rotateX(-90deg)", filter: "brightness(.45)" }],
      { duration: ms, easing: "ease-in", fill: "forwards" });
    return down.finished.then(() => {
      const up = fb.animate([{ transform: "rotateX(90deg)", filter: "brightness(.45)" }, { transform: "rotateX(0deg)", filter: "brightness(1)" }],
        { duration: ms, easing: "ease-out", fill: "forwards" });
      return up.finished.then(() => {
        paintCell(el, to);
        el.classList.remove("go");
        down.cancel();
        up.cancel();
      });
    });
  }

  // Sends a flap to a letter. Changes queue up on the flap, so a second one waits for the first.
  function flipTo(el, to, delay) {
    el._q = (el._q || Promise.resolve()).then(async () => {
      if (delay) await new Promise((r) => setTimeout(r, delay));
      if (el._c === to) return;
      if (still()) { paintCell(el, to); return; }
      const size = DRUM.length;
      const dest = DRUM.indexOf(to);
      let at = DRUM.indexOf(el._c);
      const steps = (dest - at + size) % size;
      if (steps > 5) { at = (dest - 5 + size) % size; paintCell(el, DRUM[at]); }
      const ms = steps > 3 ? 36 : 62;
      while (at !== dest) {
        const next = (at + 1) % size;
        await flipOnce(el, DRUM[at], DRUM[next], ms);
        at = next;
      }
    }).catch(() => paintCell(el, to));
  }

  function flapRow(size, cells) {
    const row = h("span", { class: "flaps " + size }, cells);
    row._cells = cells.filter((c) => !c.classList.contains("colon"));
    return row;
  }
  const flapCells = (n) => Array.from({ length: n }, () => flapCell());

  // Writes a text on a row, the letters turning one after another.
  function flapSet(row, text, stagger) {
    const chars = flapText(text).padEnd(row._cells.length, " ").slice(0, row._cells.length);
    row._cells.forEach((cell, i) => flipTo(cell, chars[i], i * (stagger == null ? 38 : stagger)));
  }

  const board = { counters: {}, line: null, clock: null, clockText: "", lines: [], at: 0, pending: [], holdUntil: 0, timer: 0 };

  const BOARD_GO = {
    turn: "Ir a lo siguiente que te toca", approve: "Ir a lo que espera tu aprobación",
    wait: "Ver los procesos que esperan a la empresa", stale: "Ver los procesos sin noticias",
  };

  function buildBoard() {
    const groups = [["turn", "Tu turno"], ["approve", "Por aprobar"], ["wait", "En espera"], ["stale", "Sin noticias"]];
    document.getElementById("b-counters").replaceChildren(...groups.map(([id, label]) => {
      const row = flapRow("big", flapCells(2));
      board.counters[id] = row;
      return h("div", { class: "b-group", "data-b": id, role: "button", tabindex: "0", title: BOARD_GO[id],
        onclick: (e) => jump(id, centerOf(e.currentTarget)),
        onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); jump(id); } } },
        h("span", { class: "plate" }, label), row, h("span", { class: "sr", "data-sr": id }, "0"));
    }));
    const colon = flapCell("colon");
    paintCell(colon, ":");
    board.clock = flapRow("mid", [flapCell(), flapCell(), colon, flapCell(), flapCell()]);
    document.getElementById("b-clock").replaceChildren(buildDial(), h("div", { class: "b-time" }, h("span", { class: "plate" }, "Hora en Santiago"), board.clock));
    board.line = flapRow("small", flapCells(34));
    document.getElementById("b-line").replaceChildren(board.line);
    tickClock();
    setInterval(tickClock, 1000);
    board.timer = setInterval(rotateLine, 7000);
  }

  // The 24-hour dial of the story, small: midnight at the top, the bot's window (18:00 to 09:00) over the top with
  // the part that has gone by lit, the hours Gonza is busy hatched underneath, and a hand for now.
  const dial = { hand: null, lit: null, hours: null };
  const DIAL_C = 50;
  const DIAL_R = 36;
  const dialPoint = (r, deg) => { const a = (deg * Math.PI) / 180; return [DIAL_C + r * Math.sin(a), DIAL_C - r * Math.cos(a)]; };
  const dialArc = (r, d0, d1) => {
    const [x0, y0] = dialPoint(r, d0);
    const [x1, y1] = dialPoint(r, d1);
    return "M" + x0.toFixed(2) + " " + y0.toFixed(2) + " A" + r + " " + r + " 0 " + (d1 - d0 > 180 ? 1 : 0) + " 1 " + x1.toFixed(2) + " " + y1.toFixed(2);
  };
  function buildDial() {
    const ticks = [];
    for (let hr = 0; hr < 24; hr++) {
      const [x0, y0] = dialPoint(DIAL_R + 4, hr * 15);
      const [x1, y1] = dialPoint(DIAL_R + (hr % 6 === 0 ? 11 : hr % 3 === 0 ? 8 : 6), hr * 15);
      ticks.push(sv("line", { class: "dl-tick", x1: x0.toFixed(2), y1: y0.toFixed(2), x2: x1.toFixed(2), y2: y1.toFixed(2) }));
    }
    dial.lit = sv("path", { class: "dl-lit", d: "" });
    dial.hand = sv("g", { class: "dl-hand" },
      sv("line", { x1: DIAL_C, y1: DIAL_C + 5, x2: DIAL_C, y2: DIAL_C - DIAL_R + 3 }),
      sv("circle", { class: "dl-tip", cx: DIAL_C, cy: DIAL_C - DIAL_R + 3, r: 3 }));
    return sv("svg", { class: "b-dial", viewBox: "-6 -6 112 112", "aria-hidden": "true" },
      sv("circle", { class: "dl-face", cx: DIAL_C, cy: DIAL_C, r: DIAL_R + 2 }),
      sv("path", { class: "dl-busy", d: dialArc(DIAL_R - 6, 135, 270) }),
      sv("path", { class: "dl-rail", d: dialArc(DIAL_R, 270, 495) }),
      dial.lit, ticks, dial.hand,
      sv("circle", { class: "dl-hub", cx: DIAL_C, cy: DIAL_C, r: 2.6 }));
  }
  function setDial(hours) {
    const deg = (hours % 24) * 15;
    const inWindow = hours >= 18 || hours < 9;
    const end = hours >= 18 ? deg : deg + 360;
    dial.lit.setAttribute("d", inWindow && end - 270 > 0.5 ? dialArc(DIAL_R, 270, end) : "");
    dial.hand.setAttribute("transform", "rotate(" + deg.toFixed(2) + " " + DIAL_C + " " + DIAL_C + ")");
  }
  // On the first draw the night goes by: the hand runs from 18:00 to the hour it is.
  function moveDial(hours) {
    if (!dial.hand) return;
    const first = dial.hours == null;
    dial.hours = hours;
    if (!first || still()) { setDial(hours); return; }
    const to = hours >= 18 ? hours : hours + 24;
    const t0 = performance.now() + 250;
    const step = (now) => {
      const k = Math.min(1, Math.max(0, (now - t0) / 1500));
      setDial(18 + (to - 18) * (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k)));
      if (k < 1) requestAnimationFrame(step);
    };
    setDial(18);
    requestAnimationFrame(step);
  }

  function tickClock() {
    let text;
    try {
      text = new Date().toLocaleTimeString("es-CL", { timeZone: "America/Santiago", hour: "2-digit", minute: "2-digit", hour12: false });
    } catch (e) {
      text = "--:--";
    }
    if (text === board.clockText) return;
    board.clockText = text;
    flapSet(board.clock, text.replace(/\D/g, "").replace(/^(\d{2})(\d{2})$/, "$1$2"), 0);
    const hm = /^(\d{2}):(\d{2})$/.exec(text);
    if (hm) moveDial(Number(hm[1]) + Number(hm[2]) / 60);
  }

  function countOnBoard(id, n) {
    const row = board.counters[id];
    const text = n > 99 ? "99" : String(n).padStart(2, " ");
    flapSet(row, text, 70);
    row.classList.toggle("zero", n === 0);
    const sr = document.querySelector('[data-sr="' + id + '"]');
    if (sr) sr.textContent = String(n);
  }

  // The messages the board rotates through, in the order of what matters.
  function boardLines(m) {
    const s = state.snap;
    const c = s.controls;
    const out = [];
    if (c.stopped) out.push("STOP ACTIVO  SIN ENVIOS");
    else if (c.window_open === true) out.push("VENTANA DE ENVIO ABIERTA");
    else if (c.window_open === false) {
      const hour = String(c.next_window || "").split(" ")[1];
      out.push("VENTANA DE ENVIO ABRE " + (hour || ""));
    }
    const dated = m.tasks.filter((t) => t.task.due_at);
    if (dated.length) {
      const left = countdown(dated[0].task, m.nowMs);
      out.push((dated[0].owner ? dated[0].owner.company : "TAREA") + "  " + left.text);
    }
    const offer = m.procs.find((p) => p.card.state === "offer");
    if (offer) out.push("OFERTA DE " + offer.card.company + " ESPERA");
    const interview = m.procs.find((p) => p.card.state === "interview");
    if (interview) out.push("ENTREVISTA CON " + interview.card.company);
    if (out.length === 0) out.push("TODO AL DIA");
    return out.map((text) => flapText(text).slice(0, 34).trimEnd());
  }

  // An announcement jumps the queue and stays for a while; then the rotation goes on.
  function announce(lines) {
    board.pending.push(...lines.slice(0, 4).map((text) => flapText(text).slice(0, 34).trimEnd()));
    board.holdUntil = 0;
    rotateLine();
  }

  function rotateLine() {
    if (!board.line || (document.hidden && board.at > 0)) return;
    if (Date.now() < board.holdUntil) return;
    let text;
    if (board.pending.length) {
      text = board.pending.shift();
      board.holdUntil = Date.now() + 6500;
    } else {
      if (board.lines.length === 0) return;
      board.at = (board.at + 1) % board.lines.length;
      text = board.lines[board.at];
    }
    flapSet(board.line, text, 14);
    document.getElementById("b-line-sr").textContent = text;
  }

  // The colour of the platform edge: the state of the day, readable from across the room.
  const MOOD_COLOURS = { calm: "var(--track)", turn: "var(--gold)", urgent: "var(--urgent)", stop: "var(--gold)" };
  function moodOf(m) {
    const s = state.snap;
    if (s.controls.stopped) return "stop";
    const urgent = m.tasks.some((t) => t.task.overdue || (t.task.due_at && Date.parse(t.task.due_at) - m.nowMs < 24 * 3600000));
    if (urgent) return "urgent";
    return turnCount(m) > 0 ? "turn" : "calm";
  }

  // The tab says how many things wait for Gonza, in its title and in its little icon. The title
  // never says what this is: the browser may be shared.
  const icon = { link: null, url: null, key: "" };
  function setTabIcon(count, mood) {
    const key = count + "|" + mood;
    if (key === icon.key) return;
    icon.key = key;
    try {
      const canvas = document.createElement("canvas");
      canvas.width = 64;
      canvas.height = 64;
      const g = canvas.getContext("2d");
      g.fillStyle = "#101a2d";
      g.beginPath();
      g.roundRect(2, 2, 60, 60, 12);
      g.fill();
      g.fillStyle = "#edf2f9";
      g.font = "700 40px 'Bahnschrift Condensed', 'Arial Narrow', sans-serif";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillText(count > 99 ? "99" : String(count), 32, 29);
      g.fillStyle = { calm: "#61afee", turn: "#fbc024", urgent: "#fa6863", stop: "#fbc024" }[mood];
      g.fillRect(8, 49, 48, 7);
      g.fillStyle = "#01030c";
      g.fillRect(2, 28, 60, 2);
      canvas.toBlob((blob) => {
        if (!blob) return;
        if (!icon.link) {
          icon.link = document.createElement("link");
          icon.link.rel = "icon";
          document.head.append(icon.link);
        }
        const old = icon.url;
        icon.url = URL.createObjectURL(blob);
        icon.link.href = icon.url;
        if (old) URL.revokeObjectURL(old);
      });
    } catch (e) { /* the icon is a courtesy */ }
  }

  function updateBoard(m) {
    const s = state.snap;
    const turn = turnCount(m);
    countOnBoard("turn", turn);
    countOnBoard("approve", s.awaiting_approval.total);
    countOnBoard("wait", m.procs.filter((p) => p.turn === "wait").length);
    countOnBoard("stale", m.procs.filter((p) => p.stale).length);
    const first = board.lines.length === 0;
    board.lines = boardLines(m);
    if (first) { board.at = -1; board.holdUntil = 0; rotateLine(); }
    const mood = moodOf(m);
    const platform = document.getElementById("platform");
    if (platform.dataset.mood !== mood) platform.dataset.mood = mood;
    document.documentElement.style.setProperty("--mood", MOOD_COLOURS[mood]);
    document.title = (turn > 0 ? "(" + turn + ") " : "") + "Panel";
    setTabIcon(turn, mood);
  }

  // A one-off gold sweep along the platform when something big happens (an interview, an offer).
  function ceremony() {
    const platform = document.getElementById("platform");
    platform.classList.remove("ceremony");
    void platform.offsetWidth;
    platform.classList.add("ceremony");
  }

  // What changed since the last picture, so the page can say so instead of redrawing in silence.
  const mailId = (mail) => mail.received_at + "|" + mail.subject;
  function diffSnapshots(prev, next) {
    const out = { fresh: new Set(), lines: [], big: false };
    if (!prev) return out;
    const seenMail = new Set(prev.today.emails.map(mailId));
    const seenTask = new Set(prev.today.tasks.map((t) => t.id));
    const was = new Map();
    for (const col of prev.board) for (const c of col.cards) was.set(c.key, c.state);
    for (const mail of next.today.emails) {
      if (seenMail.has(mailId(mail))) continue;
      out.fresh.add("mail:" + mailId(mail));
      out.lines.push((mail.company || "CORREO NUEVO") + "  " + (KIND_LABELS[mail.kind] || mail.kind));
    }
    for (const t of next.today.tasks) {
      if (seenTask.has(t.id)) continue;
      out.fresh.add("task:" + t.id);
      out.lines.push("TAREA NUEVA");
    }
    for (const col of next.board) {
      for (const c of col.cards) {
        const before = was.get(c.key);
        if (!before || before === c.state) continue;
        out.fresh.add("card:" + c.key);
        out.lines.push(c.company + "  " + (STATE_LABELS[c.state] || c.state));
        if (c.state === "interview" || c.state === "offer") out.big = true;
      }
    }
    return out;
  }

  // On the first picture of a visit: what happened since the last time the page was open.
  function sinceLastVisit(snap) {
    let last = 0;
    try { last = Date.parse(localStorage.getItem("panel.lastVisit") || ""); } catch (e) { /* no storage */ }
    const out = { fresh: new Set(), lines: [], big: false };
    if (!(last > 0)) return out;
    for (const mail of snap.today.emails) if (Date.parse(mail.received_at) > last) out.fresh.add("mail:" + mailId(mail));
    for (const col of snap.board) {
      if (!LIVE.includes(col.state) && !CLOSED.includes(col.state)) continue;
      for (const c of col.cards) if (Date.parse(c.updated_at) > last) out.fresh.add("card:" + c.key);
    }
    if (out.fresh.size) out.lines.push("DESDE TU ULTIMA VISITA " + out.fresh.size + (out.fresh.size === 1 ? " NOVEDAD" : " NOVEDADES"));
    return out;
  }
  function rememberVisit() {
    try { localStorage.setItem("panel.lastVisit", new Date().toISOString()); } catch (e) { /* no storage */ }
  }
  document.addEventListener("visibilitychange", () => {
    document.body.classList.toggle("away", document.hidden);
    if (document.hidden) rememberVisit();
  });
  window.addEventListener("pagehide", rememberVisit);

  // ---- The ticket: the one thing to do now

  // Everything that waits for Gonza, in the order that matters: what is late or due within two days,
  // an offer to answer, the applications that need his stamp, what stopped the robot, the other
  // tasks, and last the follow-ups nobody has put a task on. The page shows the first one only.
  const SOON_HOURS = 48;

  function taskStub(task, nowMs) {
    if (!task.due_at) return { big: "SIN FECHA", small: true, sub: "cuando puedas" };
    const left = countdown(task, nowMs);
    const ms = Date.parse(task.due_at) - nowMs;
    if (task.overdue || ms < 0) return { big: "VENCIDA", small: true, sub: left.text };
    const hours = Math.floor(ms / 3600000);
    if (hours < 1) return { big: "<1 H", sub: left.text };
    if (hours < SOON_HOURS) return { big: hours + " H", sub: left.text };
    return { big: Math.floor(hours / 24) + " D", sub: left.text };
  }

  // The number on the board, in the tab and in the title: the tasks, the approvals and the stuck forms
  // the server counts, plus the offers and follow-ups that have no task and are only in the ticket queue.
  function turnCount(m) {
    const s = state.snap;
    const extra = candidates(m).filter((c) => c.extra).length;
    return s.today.tasks_total + s.awaiting_approval.total + s.needs_gonza.total + extra;
  }

  function candidates(m) {
    const s = state.snap;
    const byDue = (a, b) => Date.parse(a.task.due_at) - Date.parse(b.task.due_at);
    const dated = m.tasks.filter((t) => t.task.due_at).sort(byDue);
    const soon = (t) => t.task.overdue || Date.parse(t.task.due_at) - m.nowMs < SOON_HOURS * 3600000;
    const out = [];
    const ofTask = (item) => {
      const { task, owner } = item;
      const late = task.overdue || (task.due_at && Date.parse(task.due_at) < m.nowMs);
      return Object.assign({ id: "task:" + task.id, tone: late ? "late" : "turn", kind: "Tarea", title: task.text, task,
        why: owner ? owner.company + ": " + (STATE_LABELS[owner.state] || owner.state) : null,
        open: owner ? owner.key : null, link: task.link }, taskStub(task, m.nowMs));
    };
    const ofCard = (c, kind, tone, big, sub, why, small) => ({
      id: "card:" + c.key, tone, kind, big, sub, small, title: c.company + " — " + c.title, key: c.key,
      why: why || c.reason_short || null, actions: c.actions, link: c.url,
    });
    dated.filter(soon).forEach((t) => out.push(ofTask(t)));
    for (const p of m.procs) {
      if (p.card.state === "offer" && !p.task) out.push(Object.assign(ofCard(p.card, "Oferta", "turn", "OFERTA", "decide", "Una oferta espera tu respuesta.", true), { extra: true }));
    }
    for (const c of s.awaiting_approval.cards) {
      out.push(ofCard(c, "Por aprobar", "approve", String(c.score), "puntaje", c.reason_short || "Revisa la captura: si está bien, la próxima corrida la envía."));
    }
    for (const g of REASON_GROUPS) {
      if (g.kind === "approve") continue;
      for (const c of s.needs_gonza.cards.filter((x) => (x.reason_kind || "other") === g.kind)) {
        out.push(ofCard(c, g.title, "turn", String(c.score), "puntaje", c.reason_short));
      }
    }
    dated.filter((t) => !soon(t)).forEach((t) => out.push(ofTask(t)));
    m.tasks.filter((t) => !t.task.due_at).forEach((t) => out.push(ofTask(t)));
    for (const p of m.procs) {
      if (p.task || p.card.state === "offer") continue;
      if (p.turn === "check" || p.stale) {
        out.push(Object.assign(ofCard(p.card, "Seguimiento", "turn", p.days + " D", "sin noticias",
          p.card.state === "ghosted" ? "Sin noticias: decide si insistes." : p.stale ? "Sin noticias hace " + p.days + " días: decide si insistes." : "Sin tarea: agrega el siguiente paso."), { extra: true }));
      }
    }
    return out;
  }

  // The punch: the ticket is pressed and a hole opens in the stub, then the work is done.
  function punchThen(button, run) {
    state.punched += 1;
    const ticket = button.closest(".ticket");
    if (!ticket || still()) { run(button); return; }
    ticket.classList.add("punched");
    setTimeout(() => run(button), 300);
  }

  function ticketButtons(c) {
    const acts = [];
    if (c.task) {
      acts.push(h("button", { class: "primary", "data-ticket-act": "done", title: "Ya lo hice: sale de la lista",
        onclick: twoStep("Hecha", (button) => punchThen(button, () => act("/api/task/done", { id: c.task.id }, button))) }, "Hecha"));
    }
    for (const action of c.actions || []) {
      const run = (button) => punchThen(button, () => act("/api/" + action, { key: c.key }, button));
      acts.push(h("button", { class: action === "approve" ? "primary" : "", "data-ticket-act": action, title: ACTION_HINTS[action],
        onclick: PERMANENT_ACTIONS.includes(action) ? twoStep(ACTION_LABELS[action], run) : (e) => run(e.currentTarget) }, ACTION_LABELS[action]));
    }
    const key = c.key || c.open;
    if (key) acts.push(h("button", { "data-ticket-open": key, onclick: () => openJob(key) }, "Abrir"));
    if (c.link && /^https?:\/\//i.test(c.link)) acts.push(h("a", { class: "t-link", href: c.link, target: "_blank", rel: "noopener noreferrer" }, c.task ? "Abrir enlace" : "Ver el aviso"));
    return acts;
  }

  function ticketView(c, more, enter) {
    const after = [];
    after.push(more > 0 ? "Después de esta: " + plural(more, "pendiente", "pendientes") + "." : "Es la última.");
    if (state.punched > 0) after.push("Despachadas en esta visita: " + state.punched + ".");
    return h("div", { class: "ticket-wrap" + (enter ? " in" : "") },
      h("article", { class: "ticket", "data-tone": c.tone, "data-ticket": c.id, "aria-label": "Lo siguiente que te toca" },
        h("div", { class: "ticket-stub" },
          h("span", { class: "t-kind" }, c.kind),
          h("span", { class: "t-when" + (c.small ? " small-text" : "") }, c.big),
          h("span", { class: "t-sub" }, c.sub)),
        h("div", { class: "ticket-body" },
          h("div", { class: "t-title" }, c.title),
          c.why ? h("p", { class: "t-why" }, c.why) : null,
          h("div", { class: "row t-acts" },
            ticketButtons(c),
            more > 0 ? h("button", { class: "ghost", "data-ticket-skip": c.id, title: "Pasa a la siguiente sin cerrar esta",
              onclick: () => { state.skipped.add(c.id); render(); } }, "Después") : null),
          h("div", { class: "t-after" }, after.join(" "))),
        h("span", { class: "punch" })));
  }

  // With a mouse, the ticket leans a few degrees toward the pointer and catches a little light.
  const fineMouse = window.matchMedia("(hover: hover) and (pointer: fine)");
  function tiltOnPointer(wrap) {
    if (!fineMouse.matches) return;
    wrap.addEventListener("pointermove", (e) => {
      if (still()) return;
      const box = wrap.getBoundingClientRect();
      const x = (e.clientX - box.left) / box.width;
      const y = (e.clientY - box.top) / box.height;
      wrap.style.setProperty("--ry", ((x - 0.5) * 5).toFixed(2) + "deg");
      wrap.style.setProperty("--rx", ((0.5 - y) * 4).toFixed(2) + "deg");
      wrap.style.setProperty("--gx", (x * 100).toFixed(0) + "%");
      wrap.style.setProperty("--gy", (y * 100).toFixed(0) + "%");
      wrap.style.setProperty("--glare", "1");
    });
    wrap.addEventListener("pointerleave", () => {
      for (const name of ["--rx", "--ry", "--glare"]) wrap.style.removeProperty(name);
    });
  }

  // The slot at the top of Hoy: the first ticket, or the empty platform.
  function ticketSlot(m) {
    const all = candidates(m);
    let list = all.filter((c) => !state.skipped.has(c.id));
    if (list.length === 0 && all.length > 0) { state.skipped.clear(); list = all; }
    const first = list[0];
    const slot = h("section", { class: "ticket-slot", id: "ticket", "aria-label": "Lo siguiente" });
    if (!first) {
      const cleared = state.hadTicket && state.punched > 0;
      state.hadTicket = false;
      state.ticketId = null;
      if (cleared) ceremony();
      fill(slot, h("div", { class: "ticket-clear" },
        h("span", { class: "clear-mark" }),
        h("div", {}, h("p", { class: "clear-title" }, "Andén despejado"),
          h("p", { class: "muted" }, state.punched > 0 ? "Despachaste " + plural(state.punched, "pendiente", "pendientes") + " en esta visita. Nada más espera tu turno." : "Nada espera tu turno ahora."))));
      return slot;
    }
    const enter = state.ticketId !== first.id;
    state.ticketId = first.id;
    state.hadTicket = true;
    const view = ticketView(first, list.length - 1, enter);
    tiltOnPointer(view);
    fill(slot, view);
    return slot;
  }

  // ---- Maps: SVG drawn node by node, like everything else on the page

  const SVG_NS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, ...kids) {
    const el = document.createElementNS(SVG_NS, tag);
    for (const [name, value] of Object.entries(attrs || {})) {
      if (value === false || value == null) continue;
      el.setAttribute(name, String(value));
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid === false || kid == null) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }

  // The follow-up ring: it fills as the days without news go by, and closes at the day the page
  // suggests a nudge. It fills in the first time it is drawn and is simply there after that.
  const RING_R = 9;
  const RING_C = 2 * Math.PI * RING_R;
  function ring(p) {
    const frac = Math.min(p.days / STALE_DAYS, 1);
    const tone = frac >= 1 ? " hot" : frac >= 0.7 ? " warm" : "";
    const value = sv("circle", { class: "rv", cx: 12, cy: 12, r: RING_R, "stroke-dasharray": RING_C.toFixed(2),
      "stroke-dashoffset": (RING_C * (1 - frac)).toFixed(2), transform: "rotate(-90 12 12)" });
    if (!state.rings.has(p.card.key)) {
      state.rings.add(p.card.key);
      state.after.push(() => {
        if (still() || frac === 0) return;
        value.animate([{ strokeDashoffset: RING_C }, { strokeDashoffset: RING_C * (1 - frac) }], { duration: 900, easing: "cubic-bezier(.23,1,.32,1)" });
      });
    }
    const label = "Día " + Math.min(p.days, STALE_DAYS) + " de " + STALE_DAYS + " sin noticias";
    return sv("svg", { class: "ring" + tone, viewBox: "0 0 24 24", role: "img", "aria-label": label },
      sv("title", {}, label), sv("circle", { class: "rt", cx: 12, cy: 12, r: RING_R }), value);
  }

  // The line map: the funnel as a river that narrows, the track below it with its five stops, a
  // car for every live application standing at its stop, and a siding for the ones that went quiet.
  const CAR_W = 42;
  const CAR_H = 24;
  const CAR_GAP = 6;
  const CAR_COLS = 4;
  const initials = (name) => String(name || "?").replace(/[^\p{L}\p{N}]/gu, "").slice(0, 3).toUpperCase();

  // The river of five stops that narrows with what reaches each one: the outline of the shape, 1000 wide, the
  // stops 200 apart from x = 100, centred on the line at height `track`. Procesos and the path of Cola share it.
  const stopX = (i) => 100 + 200 * i;
  function riverShape(counts, track, max) {
    const top = Math.max(1, max || 0, ...counts);
    const thick = (n) => (n === 0 ? 3 : 10 + 38 * Math.sqrt(n / top));
    const up = counts.map((n, i) => [stopX(i), track - thick(n) / 2]);
    const down = counts.map((n, i) => [stopX(i), track + thick(n) / 2]);
    const curve = (a, b) => "C " + (a[0] + 100) + " " + a[1] + " " + (b[0] - 100) + " " + b[1] + " " + b[0] + " " + b[1];
    let d = "M 0 " + up[0][1] + " L " + up[0][0] + " " + up[0][1];
    for (let i = 1; i < counts.length; i++) d += " " + curve(up[i - 1], up[i]);
    const last = counts.length - 1;
    d += " L 1000 " + up[last][1] + " L 1000 " + down[last][1] + " L " + down[last][0] + " " + down[last][1];
    for (let i = last; i > 0; i--) d += " " + curve(down[i], down[i - 1]);
    return d + " L 0 " + down[0][1] + " Z";
  }

  function planMap(m, f) {
    const X = stopX;
    const TRACK = 54;
    const ROW = CAR_H + 16;
    const counts = [f.sent, f.answered, f.tests, f.interviews, f.offers];
    const d = riverShape(counts, TRACK);

    const stops = STATIONS.map(() => []);
    const quiet = [];
    for (const p of m.procs) {
      const at = STATIONS.findIndex((st) => st.state === p.card.state);
      if (at >= 0) stops[at].push(p); else quiet.push(p);
    }
    const rows = Math.max(0, ...stops.map((list) => Math.ceil(list.length / CAR_COLS)));
    const carsTop = TRACK + 44;
    const yardY = carsTop + rows * ROW + (rows ? 6 : 0);
    const height = quiet.length ? yardY + CAR_H + 16 : carsTop + Math.max(rows, 0) * ROW;

    const cars = [];
    const rails = [];
    const car = (p, x, y) => {
      const fresh = state.fresh.has("card:" + p.card.key);
      const station = (STATE_LABELS[p.card.state] || p.card.state);
      const late = p.task && (p.task.overdue || (p.task.due_at && Date.parse(p.task.due_at) < m.nowMs));
      const label = p.card.company + " — " + p.card.title + ": " + station;
      const g = sv("g", { class: "car " + (p.card.state === "ghosted" ? "ghost" : p.turn) + (fresh ? " fresh" : ""), "data-car": p.card.key, tabindex: 0,
        role: "button", "aria-label": label, transform: "translate(" + x + " " + y + ")" },
        sv("title", {}, label),
        sv("rect", { width: CAR_W, height: CAR_H, rx: 5 }),
        sv("circle", { class: "wheel", cx: 11, cy: CAR_H + 1.5, r: 3 }),
        sv("circle", { class: "wheel", cx: CAR_W - 11, cy: CAR_H + 1.5, r: 3 }),
        sv("text", { x: CAR_W / 2, y: 16.5, "text-anchor": "middle" }, initials(p.card.company)),
        late ? sv("circle", { class: "late-dot", cx: CAR_W - 3, cy: 3, r: 4.5 }) : null);
      g.addEventListener("click", () => openJob(p.card.key));
      g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openJob(p.card.key); } });
      // A car that moved glides from where it stood; one that is new fades in.
      const key = p.card.key;
      const before = state.carPos.get(key);
      if (state.carPos.size > 0 && !still()) {
        state.after.push(() => {
          if (before && (before.x !== x || before.y !== y)) {
            g.animate([{ transform: "translate(" + before.x + "px, " + before.y + "px)" }, { transform: "translate(" + x + "px, " + y + "px)" }],
              { duration: 750, easing: "cubic-bezier(.23,1,.32,1)" });
          } else if (!before) {
            g.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500 });
          }
        });
      }
      state.carPos.set(key, { x, y });
      cars.push(g);
    };
    stops.forEach((list, i) => {
      if (list.length === 0) return;
      const span = Math.min(list.length, CAR_COLS) * (CAR_W + CAR_GAP) - CAR_GAP;
      const left = Math.round(X(i) - span / 2);
      // the spur that leaves the main line, and a short rail under every row of cars
      rails.push(sv("line", { class: "map-yard", x1: X(i), y1: TRACK + 10, x2: X(i), y2: carsTop - 6 }));
      list.forEach((p, k) => {
        const col = k % CAR_COLS;
        const row = Math.floor(k / CAR_COLS);
        car(p, left + col * (CAR_W + CAR_GAP), carsTop + row * ROW);
      });
      for (let r = 0; r < Math.ceil(list.length / CAR_COLS); r++) {
        const inRow = Math.min(CAR_COLS, list.length - r * CAR_COLS);
        const w = inRow * (CAR_W + CAR_GAP) - CAR_GAP;
        rails.push(sv("line", { class: "map-rail", x1: left - 8, y1: carsTop + r * ROW + CAR_H + 5, x2: left + w + 8, y2: carsTop + r * ROW + CAR_H + 5 }));
      }
    });
    quiet.slice(0, 20).forEach((p, k) => car(p, 150 + k * (CAR_W + CAR_GAP), yardY));

    const live = new Set(m.procs.map((p) => p.card.key));
    for (const key of Array.from(state.carPos.keys())) if (!live.has(key)) state.carPos.delete(key);

    // Opening Procesos: the river and the track are drawn from left to right, the stops light one by one and
    // the cars drive in from the left to where they stand.
    const reveal = sv("rect", { x: 0, y: -10, width: 1000, height: height + 20 });
    state.after.push(() => {
      if (!state.entering || still()) return;
      reveal.animate([{ width: "0px" }, { width: "1000px" }], { duration: 1100, delay: 150, easing: "cubic-bezier(.16,1,.3,1)", fill: "backwards" });
      document.querySelectorAll("#app .map-stop").forEach((el, i) => {
        el.animate([{ opacity: 0, transform: "scale(.4)" }, { opacity: 1, transform: "scale(1)" }], { duration: 420, delay: 300 + i * 130, easing: "cubic-bezier(.23,1,.32,1)", fill: "backwards" });
      });
      document.querySelectorAll("#app .car").forEach((g, i) => {
        const at = /translate\(([-\d.]+)[ ,]+([-\d.]+)\)/.exec(g.getAttribute("transform") || "");
        if (!at) return;
        g.animate([{ transform: "translate(" + (Number(at[1]) - 110) + "px, " + at[2] + "px)", opacity: 0 }, { transform: "translate(" + at[1] + "px, " + at[2] + "px)", opacity: 1 }],
          { duration: 760, delay: 420 + i * 55, easing: "cubic-bezier(.16,1,.3,1)", fill: "backwards" });
      });
    });

    return sv("svg", { class: "map", viewBox: "0 0 1000 " + height, role: "group", "aria-label": "Mapa de las postulaciones abiertas, una por vagón" },
      sv("defs", {}, sv("linearGradient", { id: "river-g", x1: 0, y1: 0, x2: 1, y2: 0 },
        sv("stop", { class: "rg-a", offset: "0%" }), sv("stop", { class: "rg-a", offset: "78%" }), sv("stop", { class: "rg-b", offset: "100%" })),
        sv("clipPath", { id: "river-clip" }, reveal)),
      sv("g", { "clip-path": "url(#river-clip)" },
        sv("path", { class: "map-river", d }),
        sv("line", { class: "map-flow", x1: 0, y1: TRACK, x2: 1000, y2: TRACK }),
        sv("line", { class: "map-track", x1: 0, y1: TRACK, x2: 1000, y2: TRACK })),
      STATIONS.map((st, i) => sv("circle", { class: "map-stop" + (counts[i] === 0 ? " off" : ""), cx: X(i), cy: TRACK, r: 10 })),
      rails,
      cars,
      quiet.length
        ? [sv("text", { class: "map-label", x: 8, y: yardY + 16 }, "Sin respuesta"),
           sv("line", { class: "map-siding", x1: 126, y1: yardY + CAR_H + 5, x2: 1000, y2: yardY + CAR_H + 5 })]
        : null);
  }

  // ---- Header

  function renderControls() {
    const c = state.snap.controls;
    const claude = state.snap.claude;
    let window_ = "Ventana de ejecución: sin datos";
    if (c.window_open === true) window_ = "Ventana de ejecución abierta";
    if (c.window_open === false) {
      // "2026-10-06 18:00" -> "18:00" when it is today (Santiago), "07/10 18:00" otherwise.
      const [day, hour] = String(c.next_window || "").split(" ");
      const today = new Date(state.snap.generated_at).toLocaleDateString("sv-SE", { timeZone: "America/Santiago" });
      const opens = day === today && hour ? hour : day && hour ? day.slice(8, 10) + "/" + day.slice(5, 7) + " " + hour : c.next_window;
      window_ = "Ventana cerrada" + (c.next_window ? ", abre " + opens : "");
    }
    const spend = "Claude, 24 h: " + usd(claude.spent_24h) + (claude.daily_budget != null ? " de " + usd(claude.daily_budget) : "");
    document.getElementById("b-info").replaceChildren(
      h("span", { class: "led " + (c.window_open === true ? "on" : "off") }, window_),
      h("span", {}, spend));
    document.getElementById("controls").replaceChildren(
      h("span", { id: "run-state", class: "badge " + (c.stopped ? "bad" : "ok") }, c.stopped ? "STOP activo" : "En marcha"),
      c.stopped
        ? h("button", { id: "resume", onclick: (e) => act("/api/resume", {}, e.currentTarget) }, "Quitar STOP")
        : h("button", { id: "stop", class: "danger", onclick: (e) => act("/api/stop", {}, e.currentTarget) }, "STOP"),
      h("button", { id: "open-palette", class: "kbd-btn", title: "Buscar una postulación o saltar a una sección", onclick: openPalette }, "Buscar", h("kbd", {}, "Ctrl K")),
      h("button", { id: "theme", class: "kbd-btn", title: "Tema: automático, claro u oscuro", "aria-label": "Cambiar el tema", onclick: cycleTheme }, "Tema", h("kbd", {}, "T")),
      h("button", { id: "open-keys", class: "kbd-btn", title: "Atajos de teclado", "aria-label": "Atajos de teclado", onclick: toggleKeys }, h("kbd", {}, "?")),
    );
  }

  function renderTabs(m) {
    const s = state.snap;
    const labels = {
      hoy: ["Hoy", turnCount(m), true],
      procesos: ["Procesos", m.procs.length, false],
      cola: ["Cola", countOf(s, "scored") + countOf(s, "prepared"), false],
      learn: ["Aprender", s.learn.due, false],
    };
    document.querySelectorAll("[data-tab]").forEach((b) => {
      const [name, n, hot] = labels[b.dataset.tab];
      b.setAttribute("aria-selected", String(b.dataset.tab === state.tab));
      b.setAttribute("tabindex", b.dataset.tab === state.tab ? "0" : "-1");
      b.replaceChildren(name, h("span", { class: "count" + (hot && n > 0 ? " hot" : "") }, String(n)));
      if (b._n != null && b._n !== n && !still()) { b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); }
      b._n = n;
    });
    moveInk();
  }

  function countOf(s, st) {
    const col = s.board.find((c) => c.state === st);
    return col ? col.total : 0;
  }

  function render(opts) {
    const before = opts && opts.tabChange ? null : rectsOf(document.getElementById("app"));
    state.entering = !!(opts && opts.tabChange) && !still();
    const m = model(state.snap);
    renderControls();
    renderTabs(m);
    updateBoard(m);
    let body;
    if (state.tab === "hoy") body = renderHoy(m);
    else if (state.tab === "procesos") body = renderProcesos(m);
    else if (state.tab === "cola") body = renderCola();
    else body = renderLearn();
    const app = document.getElementById("app");
    app.setAttribute("aria-labelledby", "tab-" + state.tab);
    // A redraw replaces every element, so the one that had the keyboard focus is found again in the
    // new page, with its caret, instead of leaving the focus on nothing.
    const focused = focusMark(document.activeElement);
    app.replaceChildren(...body.flat(Infinity).filter((node) => node != null && node !== false));
    restoreFocus(focused);
    if (before) glide(before, app);
    if (state.entering) enterView(app);
    applyCursor();
    persist();
    // Things that need the new nodes to be in the page (a car gliding to its stop, a ring filling).
    const later = state.after.splice(0);
    later.forEach((run) => run());
    // The drawer is not redrawn here: it depends on the application that was opened, not on the
    // snapshot, and rebuilding it would lose its screenshot, its notes and its open sections.
  }

  // How to find an element of the page again after it is drawn anew: by its id, or by the card it
  // sits in and the one data attribute that names what it does.
  function focusMark(el) {
    const app = document.getElementById("app");
    if (el == null || !app.contains(el)) return null;
    let selector = null;
    if (el.id) selector = "#" + CSS.escape(el.id);
    else {
      const card = el.closest("[data-card]");
      const scope = card ? '[data-card="' + CSS.escape(card.dataset.card) + '"] ' : "";
      for (const attr of ["data-done", "data-open", "data-action", "data-filter", "data-grade", "data-ticket-act", "data-ticket-open", "data-ticket-skip", "data-car"]) {
        if (el.hasAttribute(attr)) selector = scope + "[" + attr + '="' + CSS.escape(el.getAttribute(attr)) + '"]';
      }
      const fold = el.closest("details[data-fold]");
      if (selector == null && el.tagName === "SUMMARY" && fold) selector = 'details[data-fold="' + CSS.escape(fold.dataset.fold) + '"] > summary';
    }
    if (selector == null) return null;
    const caret = "selectionStart" in el ? [el.selectionStart, el.selectionEnd] : null;
    return { selector, caret };
  }

  function restoreFocus(mark) {
    if (mark == null) return;
    const el = document.getElementById("app").querySelector(mark.selector);
    if (el == null) return;
    el.focus({ preventScroll: true });
    if (mark.caret && "setSelectionRange" in el) el.setSelectionRange(mark.caret[0], mark.caret[1]);
  }

  // A fold that remembers whether Gonza opened it, across the redraws of every refresh.
  function fold(id, defaultOpen, summary, content) {
    const open = id in state.folds ? state.folds[id] : defaultOpen;
    const el = h("details", { class: "group", "data-fold": id, open: open }, h("summary", {}, summary), content);
    el.addEventListener("toggle", () => { state.folds[id] = el.open; persist(); });
    return el;
  }

  // ---- Hoy: what is on Gonza's plate

  function taskRow(item, nowMs) {
    const { task, owner } = item;
    const left = countdown(task, nowMs);
    const cls = "item" + (left && left.tone === "late" ? " late" : left && left.tone === "soon" ? " now" : "")
      + (state.ticketId === "task:" + task.id ? " next" : "") + (state.fresh.has("task:" + task.id) ? " fresh" : "");
    return h("li", { class: cls, "data-task": task.id },
      h("div", { class: "item-main" },
        h("span", { class: "item-title" }, task.text),
        h("div", { class: "row small muted" },
          owner ? h("span", { class: "chip" }, owner.company + ": " + (STATE_LABELS[owner.state] || owner.state)) : null,
          task.link ? link(task.link, "Abrir enlace") : null)),
      h("div", { class: "item-side" },
        left ? h("span", { class: "when " + left.tone }, left.text) : null,
        h("button", { "data-done": task.id, title: "Ya lo hice: sale de la lista", "aria-label": "Hecha: " + task.text.slice(0, 90),
          onclick: twoStep("Hecha", (button) => act("/api/task/done", { id: task.id }, button)) }, "Hecha")));
  }

  function summaryLine(tasks, nowMs) {
    if (tasks.length === 0) return "No tienes tareas abiertas.";
    const late = tasks.filter((t) => t.task.overdue).length;
    const dated = tasks.filter((t) => t.task.due_at && !t.task.overdue);
    let text = plural(tasks.length, "tarea abierta", "tareas abiertas");
    if (late) text += ", " + plural(late, "vencida", "vencidas");
    if (dated.length) {
      const next = countdown(dated[0].task, nowMs);
      text += ". La más cercana: " + next.text.charAt(0).toLowerCase() + next.text.slice(1);
    }
    return text + ".";
  }

  function renderTasks(m) {
    const dated = m.tasks.filter((t) => t.task.due_at);
    const undated = m.tasks.filter((t) => !t.task.due_at);
    const s = state.snap.today;
    return h("div", {},
      h("h2", {}, "Tu turno"),
      h("p", { class: "lead", id: "today-summary" }, summaryLine(m.tasks, m.nowMs)),
      dated.length
        ? h("section", { class: "block" }, h("h3", {}, "Con fecha", h("span", { class: "count" }, String(dated.length))),
            h("ul", { class: "items" }, dated.map((t) => taskRow(t, m.nowMs))))
        : null,
      h("section", { class: "block" },
        h("h3", {}, "Cuando puedas", h("span", { class: "count" }, String(undated.length))),
        undated.length === 0
          ? h("p", { class: "empty" }, "Sin tareas abiertas.")
          : h("ul", { class: "items" }, undated.map((t) => taskRow(t, m.nowMs)))),
      s.tasks_total > s.tasks.length ? h("p", { class: "muted small" }, "y " + (s.tasks_total - s.tasks.length) + " más…") : null);
  }

  function cardTitle(c) {
    return h("button", { class: "link", "data-open": c.key, onclick: () => openJob(c.key) }, c.company + " — " + c.title);
  }

  function actionButton(action, key) {
    const run = (button) => act("/api/" + action, { key }, button);
    return h("button", {
      class: action === "approve" ? "primary" : "", "data-action": action, title: ACTION_HINTS[action],

    }, ACTION_LABELS[action]);

  const PERMANENT_ACTIONS = ["approve", "confirm"];
  const PERMANENT_MARKS = ["withdrawn", "rejected", "accepted"];

  // One application that waits for Gonza: what it is, why, and the buttons for the engine's own
  // decisions. The long reason stays behind a fold; the short sentence says what to do.
  function decisionRow(c) {
    const long = c.reason && c.reason_kind !== "manual_apply" && c.reason_kind !== "other" ? c.reason : null;

        c.reason_short && c.reason_kind !== "other" ? h("span", { class: "small muted" }, c.reason_short) : null,
        c.reason_kind === "other" && c.reason ? h("span", { class: "small muted wrap-any" }, c.reason) : null,
        long ? h("details", { class: "fold" }, h("summary", {}, "Ver el detalle"), h("pre", { class: "wrap" }, long)) : null,
        h("span", { class: "small muted" }, "Puntaje " + c.score + " en " + c.source),
        h("div", { class: "row act-row" },
          c.actions.map((a) => actionButton(a, c.key)),
          c.url ? h("span", { class: "small" }, link(c.url, "Ver el aviso")) : null)));
  }

  function decisions(s) {
    const groups = REASON_GROUPS.map((g) => ({
      ...g,
      cards: g.kind === "approve" ? s.awaiting_approval.cards : s.needs_gonza.cards.filter((c) => (c.reason_kind || "other") === g.kind),
    })).filter((g) => g.cards.length > 0);

    return h("section", { id: "decisions" },
      h("h2", {}, "Esperan tu decisión"),
      h("p", { class: "lead" }, total === 0 ? "Nada pendiente." : plural(total, "postulación espera", "postulaciones esperan") + " algo de ti, por tipo de ayuda."),
      groups.length === 0
        ? h("p", { class: "empty" }, "Nada pendiente.")
        : groups.map((g) => fold("dec-" + g.kind, g.cards.length <= OPEN_BELOW,
            [g.title, h("span", { class: "count" }, String(g.cards.length))],
            h("ul", { class: "items" }, g.cards.map(decisionRow)))),
      s.needs_gonza.total > s.needs_gonza.cards.length ? h("p", { class: "muted small" }, "y " + (s.needs_gonza.total - s.needs_gonza.cards.length) + " más…") : null,
      s.awaiting_approval.cards.length === 0 ? h("p", { class: "small muted" }, "Por aprobar: nada por aprobar.") : null);
  }

  function mailView(mail, nowMs) {

  // ---- Procesos: where every application is, and whose turn it is

  // ---- Cola: what jobbot has found and prepared

  // ---- The story's ideas as views: what jobbot did in the last day, the five layers between a posting and a

  const hourOf = (iso) => {

  // A label that sits at a place along a drawing: its box is the drawing's width, so a percentage is the place.

  // The last 24 hours, left to right up to now: the postings jobbot kept as bars, every move of an application as
  // a dot, and the hours it stays quiet (your busy ones) hatched, like the dial of the board.
  function renderNight(m) {
    const s = state.snap;
    const a = s.activity;
    if (!a || !Array.isArray(a.slots) || a.slots.length === 0) return null;

    const waiting = new Set(s.needs_gonza.cards.concat(s.awaiting_approval.cards).map((c) => c.key));
    // moves from oldest to newest, each in the first row where it does not touch the one before
    const rowEnd = [];
    const placed = a.moves.slice().sort((x, y) => Date.parse(x.at) - Date.parse(y.at)).map((mv) => {
      const x = Math.max(0, Math.min(W, ((Date.parse(mv.at) - from) / span) * W));
      let row = rowEnd.findIndex((end) => x - end >= 13);
      if (row < 0) row = rowEnd.length;
      row = Math.min(row, 4);
      rowEnd[row] = x;
      return { mv, x, row };
    });
    const H = BASE + 22 + Math.max(1, rowEnd.length) * 14;
    const capped = a.moves_total > a.moves.length;
    const sentCount = a.moves.filter((mv) => mv.to === "submitted").length;
    let line = "Sin avisos nuevos ni movimientos en las últimas 24 horas.";
    if (seenTotal > 0 || a.moves_total > 0) {
      line = "En las últimas 24 horas guardó " + plural(seenTotal, "aviso nuevo", "avisos nuevos") + " y registró " + plural(a.moves_total, "movimiento", "movimientos")
        + (!capped && sentCount > 0 ? " (" + (sentCount === 1 ? "1 es un envío" : sentCount + " son envíos") + ")" : "") + ".";
    }

    const busy = a.slots.map((slot, i) => (slot.open === false ? sv("rect", { class: "n-busy", x: (i * slotW).toFixed(2), y: 0, width: (slotW + 0.5).toFixed(2), height: H }) : null));
    const bars = a.slots.map((slot, i) => {
      if (slot.seen === 0) return null;
      const tall = 6 + 64 * (slot.seen / maxSeen);
      const rect = sv("rect", { class: "n-bar", x: (i * slotW + 2).toFixed(2), width: (slotW - 4).toFixed(2), y: (BASE - tall).toFixed(1), height: tall.toFixed(1), rx: 2 },
        sv("title", {}, hourOf(slot.at) + ": " + plural(slot.seen, "aviso nuevo", "avisos nuevos")));
      rect.style.setProperty("--bi", String(i));
      return rect;
    });
    const dots = placed.map(({ mv, x, row }) => {
      const tone = waiting.has(mv.key) ? " ask" : mv.to === "submitted" ? " sent" : "";
      const label = mv.company + " — " + mv.title + ": " + (STATE_LABELS[mv.to] || mv.to) + ", " + hourOf(mv.at);
      const g = sv("g", { class: "n-dot" + tone, "data-move": mv.key, "aria-hidden": "true", transform: "translate(" + x.toFixed(1) + " " + (BASE + 18 + row * 14) + ")" },
        sv("title", {}, label), sv("circle", { r: 5.5 }));
      g.style.setProperty("--bi", String(Math.floor((x / W) * a.slots.length)));
      g.addEventListener("click", () => openJob(mv.key, g));
      return g;
    });
    const nowX = Math.max(0, Math.min(W, ((m.nowMs - from) / span) * W));
    const svg = sv("svg", { class: "night-svg", viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": line },
      sv("defs", {}, sv("pattern", { id: "night-hatch", width: 7, height: 7, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" }, sv("line", { class: "n-hatch", x1: 0, y1: 0, x2: 0, y2: 7 }))),
      busy,
      sv("line", { class: "n-base", x1: 0, y1: BASE, x2: W, y2: BASE }),
      bars, dots,
      sv("line", { class: "n-now", x1: nowX.toFixed(1), y1: 0, x2: nowX.toFixed(1), y2: H }));

    const marks = [];
    a.slots.forEach((slot, i) => {
      if (new Date(slot.at).getUTCMinutes() !== 0 || hourNumber(slot.at) % 3 !== 0) return;
      const at = (i / a.slots.length) * 100;
      if (Math.abs(at - (nowX / W) * 100) < 11 || at < 2) return;
      marks.push(atPercent("span", "", at, String(hourNumber(slot.at)).padStart(2, "0") + ":00"));
    });
    const nowPercent = (nowX / W) * 100;
    marks.push(atPercent("span", "now" + (nowPercent > 94 ? " edge-r" : ""), nowPercent, "ahora"));

    const anyBusy = a.slots.some((slot) => slot.open === false);
    const list = a.moves.length === 0 ? null : fold("night-moves", false,
      capped ? "Ver los últimos " + a.moves.length + " de " + a.moves_total + " movimientos" : "Ver " + (a.moves.length === 1 ? "el movimiento" : "los " + a.moves.length + " movimientos"),
      h("ul", { class: "items n-list" }, a.moves.map((mv) => h("li", { class: "n-li" },
        h("span", { class: "small muted num" }, hourOf(mv.at) + (dayOf(mv.at) === dayOf(new Date(m.nowMs).toISOString()) ? "" : " (ayer)")),

        h("span", {}, h("i", { class: "sw bar" }), "avisos nuevos"),

  // The five layers between a posting and a send, the same ones the story draws.
  const LAYERS = [
    { id: "aviso", label: "Aviso" }, { id: "puntaje", label: "Puntaje" }, { id: "cv", label: "CV" },
    { id: "respuestas", label: "Respuestas" }, { id: "compuerta", label: "Compuerta" },
  ];
  const SENT_STATES = ["submitted", "replied", "technical_test", "interview", "offer", "accepted", "rejected", "ghosted"];

  // Where an application stands among the layers (`at` is the one it is in) and whose turn it is there: the
  // robot's ("robot"), Gonza's ("you"), or neither because it already went out ("done") or closed ("closed").
  function layerOf(c) {
    if (SENT_STATES.includes(c.state)) return { at: LAYERS.length, who: "done", text: "" };
    if (c.state === "scored") return { at: 2, who: "robot", text: "jobbot prepara el CV en la próxima ventana" };
    if (c.state === "prepared") {
      // "approve" is offered exactly while a dry-run capture waits for Gonza
      if (c.approved) return { at: 4, who: "robot", text: "aprobada por ti: sale en la próxima ventana" };
      if (c.actions.includes("approve")) return { at: 4, who: "you", text: "espera tu aprobación" };
      return { at: 3, who: "robot", text: "jobbot llena el formulario en prueba en seco" };
    }
    if (c.state === "needs_gonza") {
      const kind = c.reason_kind || "other";
      const at = kind === "missing_answers" || kind === "blocked" || kind === "error" ? 3 : 4;
      return { at, who: "you", text: c.reason_short || "necesita una mirada tuya" };
    }
    return { at: -1, who: "closed", text: "" };
  }

  // Five dots and the name of the layer, under a row of the queue.
  function miniPath(c) {
    const l = layerOf(c);
    if (l.at < 0 || l.who === "done") return null;
    const name = LAYERS[l.at].label;
    return h("div", { class: "mini", "data-layer": LAYERS[l.at].id },
      h("span", { class: "steps", role: "img", "aria-label": "Capa " + (l.at + 1) + " de 5: " + name },
        LAYERS.map((ly, i) => h("span", { class: "step" + (i < l.at ? " done" : i === l.at ? " here" + (l.who === "you" ? " you" : "") : "") }))),
      h("span", { class: "small muted" }, name + " · " + l.text));
  }

  // Cola: how far this week's postings got, as the same river as Procesos, narrowing at each layer.
  function renderRoute(s) {
    const p = s.pipeline;
    if (!p) return null;
    const counts = [p.seen, p.above, p.with_cv, p.complete, p.sent];
    const names = ["Avisos guardados", "Pasaron el umbral", "Con CV a la medida", "Formulario completo", "Enviados"];
    const of = ["", "de los guardados", "de los que pasaron", "de los que tienen CV", "de los completos"];
    let sentence = "Sin avisos guardados en los últimos " + p.days + " días.";
    if (p.seen > 0) {
      sentence = "De " + plural(p.seen, "aviso guardado", "avisos guardados") + " en " + p.days + " días, " + p.above + (p.threshold != null ? " pasaron tu umbral de " + Math.round(p.threshold) : " pasaron el umbral")
        + ", " + p.complete + " tienen el formulario completo y " + p.sent + (p.sent === 1 ? " ya se envió." : " ya se enviaron.");
    }
    const TRACK = 38;
    const reveal = sv("rect", { x: 0, y: -10, width: 1000, height: 100 });
    state.after.push(() => {
      if (!state.entering || still()) return;
      reveal.animate([{ width: "0px" }, { width: "1000px" }], { duration: 1000, delay: 200, easing: "cubic-bezier(.16,1,.3,1)", fill: "backwards" });
      document.querySelectorAll("#route .map-stop").forEach((el, i) => {
        el.animate([{ opacity: 0, transform: "scale(.4)" }, { opacity: 1, transform: "scale(1)" }], { duration: 420, delay: 300 + i * 130, easing: "cubic-bezier(.23,1,.32,1)", fill: "backwards" });
      });
    });

      const share = i === 0 ? "en " + p.days + " días" : counts[i - 1] > 0 ? pct(n / counts[i - 1]) + " " + of[i] : "";
      return h("div", { class: "station" + (n === 0 ? " empty-stop" : ""), "data-layer": LAYERS[i].id },
        h("div", { class: "station-n" }, String(n)), h("div", { class: "station-l" }, names[i]), h("div", { class: "station-c" }, share));
    }));
    const svg = sv("svg", { class: "map route-map", viewBox: "0 0 1000 76", role: "img", "aria-label": sentence },
      sv("defs", {}, sv("linearGradient", { id: "route-g", x1: 0, y1: 0, x2: 1, y2: 0 },
        sv("stop", { class: "rg-a", offset: "0%" }), sv("stop", { class: "rg-a", offset: "78%" }), sv("stop", { class: "rg-b", offset: "100%" })),
