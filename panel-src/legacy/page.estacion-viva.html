      counts.map((n, i) => sv("circle", { class: "map-stop" + (n === 0 ? " off" : ""), cx: stopX(i), cy: TRACK, r: 10 })));
    return h("section", { class: "block", id: "route", "aria-labelledby": "route-h" },
      h("h3", { id: "route-h" }, "Del aviso al envío", h("span", { class: "n-sub" }, "últimos " + p.days + " días")),
      h("p", { class: "lead" }, sentence),
      h("div", { class: "plan" }, h("div", { class: "plan-in" }, line, svg)));
  }

  // Cola: the scores of the same postings, a line where the threshold is, and a slider to try another one. It
  // only shows what would happen: the threshold itself lives in profile/criteria.toml.
  const HIST_LO = 20;
  function renderThreshold(s) {
    const p = s.pipeline;
    if (!p || p.threshold == null || p.seen === 0 || !Array.isArray(p.score_counts) || p.score_counts.length < 101) return null;
    const t0 = Math.round(p.threshold);
    const counts = p.score_counts;
    const values = [];
    for (let score = HIST_LO; score <= 100; score++) values.push(score === HIST_LO ? counts.slice(0, HIST_LO + 1).reduce((n, x) => n + x, 0) : counts[score]);
    const max = Math.max(1, ...values);
    const at = (score) => ((score - HIST_LO) / (100 - HIST_LO + 1)) * 100;
    const bars = values.map((n, i) => {
      if (n === 0) return null;
      const tall = Math.max(3, 104 * (n / max));
      const rect = sv("rect", { class: "h-bar", x: i * 10, width: 9, y: (108 - tall).toFixed(1), height: tall.toFixed(1) },
        sv("title", {}, (i === 0 ? "20 o menos" : String(HIST_LO + i)) + ": " + plural(n, "aviso", "avisos")));
      rect.dataset.score = String(HIST_LO + i);
      rect.style.setProperty("--bi", String(i));
      return rect;
    });
    const thr = sv("line", { class: "h-thr", x1: (t0 - HIST_LO) * 10, x2: (t0 - HIST_LO) * 10, y1: 0, y2: 108 });
    const tryLine = sv("line", { class: "h-if", x1: 0, x2: 0, y1: 0, y2: 108, visibility: "hidden" });
    const svg = sv("svg", { class: "thr-svg", viewBox: "0 0 810 108", preserveAspectRatio: "none", role: "img",
      "aria-label": "Cuántos avisos tienen cada puntaje; el umbral está en " + t0 }, bars, thr, tryLine);
    const ticks = [40, 80, 100].filter((v) => Math.abs(v - t0) >= 8).map((v) => atPercent("span", "", at(v) + 0.6, String(v)));
    ticks.unshift(atPercent("span", "", 0.6, "≤" + HIST_LO));
    ticks.push(atPercent("span", "tag", at(t0), "umbral " + t0));

    const noteIn = h("span", { class: "thr-note in", id: "thr-in" });
    const noteOut = h("span", { class: "thr-note out", id: "thr-out-note" });
    const say = h("p", { class: "small", id: "thr-say", role: "status" });
    const out = h("output", { id: "thr-out", for: "thr-range" }, String(t0));
    const reset = h("button", { id: "thr-reset", hidden: true, onclick: () => { range.value = String(t0); paint(t0); } }, "Volver a " + t0);
    const range = h("input", { type: "range", id: "thr-range", min: "40", max: "100", step: "1", value: String(state.whatIf != null ? state.whatIf : t0),
      "aria-label": "Probar otro umbral", oninput: () => paint(Number(range.value)) });
    const total = sumFrom(counts, 0);
    function paint(v) {
      state.whatIf = v === t0 ? null : v;
      bars.forEach((rect) => { if (rect) rect.classList.toggle("in", Number(rect.dataset.score) >= v); });
      out.textContent = String(v);
      reset.hidden = v === t0;
      // what each side of the line holds, so the picture says it too
      const passing = sumFrom(counts, v);
      noteIn.textContent = passing + (passing === 1 ? " pasa" : " pasan");
      noteOut.textContent = (total - passing) + " quedan fuera";
      noteIn.style.left = Math.min(100, at(v) + 1) + "%";
      noteOut.style.left = Math.max(0, at(v) - 1) + "%";
      if (v === t0) {
        tryLine.setAttribute("visibility", "hidden");
        say.textContent = "Mueve el deslizador para ver qué pasaría con otro umbral. Solo es una vista: no cambia nada; el umbral se cambia en profile/criteria.toml.";
      } else {
        tryLine.setAttribute("x1", String((v - HIST_LO) * 10));
        tryLine.setAttribute("x2", String((v - HIST_LO) * 10));
        tryLine.setAttribute("visibility", "visible");
        const diff = sumFrom(counts, v) - sumFrom(counts, t0);
        say.textContent = "Con " + v + " pasarían " + sumFrom(counts, v) + " de " + total + " avisos: "
          + (diff === 0 ? "los mismos que con " + t0 : plural(Math.abs(diff), diff > 0 ? "más" : "menos", diff > 0 ? "más" : "menos") + " que con " + t0) + ". Solo es una vista: no cambia nada.";
      }
    }
    paint(state.whatIf != null ? state.whatIf : t0);
    return h("section", { class: "block", id: "threshold", "aria-labelledby": "thr-h" },
      h("h3", { id: "thr-h" }, "Tu umbral", h("span", { class: "n-sub" }, "puntaje de esos avisos")),
      h("div", { class: "thr-plot" }, svg, noteIn, noteOut, h("div", { class: "thr-axis", "aria-hidden": "true" }, ticks)),
      h("div", { class: "thr-try" }, h("label", { for: "thr-range" }, "Probar otro umbral"), range, out, reset),
      say);
  }

  // Cola: how much jobbot may do on its own. The first sends need your approval; after them it keeps to a cap.
  function renderTrust(s) {
    const t = s.trust;
    if (!t) return null;
    const boxes = [];
    for (let i = 0; i < t.first_n; i++) {
      const box = h("li", { class: "t-box" + (i < t.reviewed ? " done" : ""), "data-n": String(i + 1) }, h("span", { class: "sr" }, i < t.reviewed ? "aprobada" : "por aprobar"));
      box.style.setProperty("--bi", String(i));
      boxes.push(box);
    }
    const sentence = t.review_phase
      ? "Llevas " + t.reviewed + " de " + t.first_n + " envíos aprobados por ti. Después de los primeros " + t.first_n + ", jobbot envía solo, hasta " + t.cap_after + " al día."
      : "Ya envía solo: revisaste los primeros " + t.first_n + ". Tiene un tope de " + t.cap + " envíos por día.";
    const meter = h("i", {});
    meter.style.setProperty("--w", String(t.cap > 0 ? Math.min(1, t.sent_24h / t.cap) : 0));
    return h("section", { class: "block", id: "trust", "aria-labelledby": "trust-h" },
      h("h3", { id: "trust-h" }, "Confianza"),
      h("p", { class: "lead" }, sentence),
      t.review_phase ? h("ol", { class: "t-boxes", "aria-label": "Envíos aprobados por ti" }, boxes) : null,
      h("div", { class: "cap" },
        h("div", { class: "cap-label" }, h("span", {}, "Envíos de las últimas 24 horas"), h("strong", { class: "num" }, t.sent_24h + " de " + t.cap)),
        h("div", { class: "cap-bar", role: "img", "aria-label": t.sent_24h + " de " + t.cap + " envíos permitidos" }, meter)));
  }

  // ---- Detalle de una postulación

  function revokeShot() {
    if (state.shotUrl) { URL.revokeObjectURL(state.shotUrl); }
    state.shotUrl = null;
    state.shotKey = null;
  }

  function shotImage() {
    return h("img", { class: "shot", src: state.shotUrl, alt: "Captura de la prueba en seco" });
  }

  async function loadShot(key) {
    try {
      const res = await fetch("/api/shot?key=" + encodeURIComponent(key), { headers: { "X-Panel-Token": token } });
      if (!res.ok || state.openKey !== key) return;
      const blob = await res.blob();
      revokeShot();
      state.shotUrl = URL.createObjectURL(blob);
      state.shotKey = key;
      const slot = document.getElementById("shot-slot");
      if (slot) slot.replaceChildren(shotImage());
    } catch (e) { /* the drawer just shows no picture */ }
  }

  const drawerOpen = () => document.getElementById("detail").classList.contains("open");

  // The element a drawer grows out of (and goes back into): the row's title, the car, the ticket's button.
  function originOf(key) {
    const app = document.getElementById("app");
    for (const attr of ["data-open", "data-ticket-open", "data-car"]) {
      for (const el of app.querySelectorAll("[" + attr + '="' + CSS.escape(key) + '"]')) if (el.getClientRects().length > 0) return el;
    }
    return null;
  }

  async function openJob(key, origin, dir) {
    const same = state.openKey === key && state.detail != null;
    if (!same) { state.note = ""; revokeShot(); state.journeyIn = true; }
    state.openKey = key;
    const r = await api("/api/job?key=" + encodeURIComponent(key));
    if (!r.ok) {
      state.openKey = null;
      state.detail = null;
      toast(said(r, "No se pudo abrir la postulación."), false);
      renderDetail();
      return;
    }
    // Another application was asked for while this one loaded: that one wins.
    if (state.openKey !== key) return;
    const wasOpen = drawerOpen();
    const show = () => { state.detail = r.data; renderDetail(); };
    if (same) {
      show();
    } else if (wasOpen) {
      // from one application to the next: the drawer's content slides the way you went
      transition(typeof dir === "string" ? dir : "next", show);
      writeHash(false);
    } else {
      const o = origin && origin.getClientRects && origin.getClientRects().length ? origin : originOf(key);
      const active = document.activeElement;
      state.returnTo = active && active !== document.body ? active : o;
      const travels = o && !(o instanceof SVGElement);
      if (travels && document.startViewTransition && !still()) o.style.viewTransitionName = "job";
      const clear = () => { if (o) o.style.viewTransitionName = ""; };
      transition("open", () => { clear(); show(); document.getElementById("detail").focus({ preventScroll: true }); }).then(clear);
      state.drawerPushed = writeHash(true);
    }
    if (r.data.card.has_screenshot && state.shotKey !== key) loadShot(key);
  }

  function closeJob(opts) {
    if (state.openKey == null && state.detail == null) return;
    const o = state.openKey ? originOf(state.openKey) : null;
    const back = state.returnTo;
    const finish = () => {
      state.openKey = null;
      state.detail = null;
      state.note = "";
      revokeShot();
      renderDetail();
      if (o && !(o instanceof SVGElement) && document.startViewTransition && !still()) o.style.viewTransitionName = "job";
    };
    transition("close", finish).then(() => {
      if (o) o.style.viewTransitionName = "";
      const target = back && back.isConnected ? back : o;
      if (target && target.focus) target.focus({ preventScroll: true });
    });
    if (state.drawerPushed && !(opts && opts.fromPop)) {
      // the address had a step for the drawer: take it back, so "Back" does not reopen it
      state.drawerPushed = false;
      state.ignorePop += 1;
      history.back();
    } else {
      state.drawerPushed = false;
      writeHash(false);
    }
  }

  function markJob(key, newState, button) {
    const box = document.getElementById("mark-note");
    const note = (box ? box.value : state.note).trim();
    return act("/api/mark", { key, state: newState, note: note || null }, button, () => { state.note = ""; });
  }

  // One bar per factor of the score, as long as the points it gave, and the total at the end.
  function scoreBars(detail) {
    const entries = Object.entries(detail);
    const top = Math.max(1, ...entries.map(([, v]) => Math.abs(Number(v)) || 0));
    return h("div", { class: "bars", role: "list", "aria-label": "Puntos de cada factor" }, entries.map(([k, v]) => {
      const fill = h("i", {});
      fill.style.setProperty("--w", String(Math.min(1, Math.abs(Number(v)) / top)));
      return h("div", { class: "bar-row", role: "listitem" }, h("span", { class: "bar-k" }, k), h("span", { class: "bar-t", "aria-hidden": "true" }, fill), h("span", { class: "bar-v num" }, String(v)));
    }));
  }

  // Where one application stands among the five layers, as a line you can follow from the top: what is done, where
  // it is now and whose turn it is, and what is still ahead. Once it went out, the line goes on with the stations
  // of Procesos. The buttons that act on the layer it is stuck at sit right there.
  const STATUS_WORD = { done: "hecho", robot: "jobbot trabaja aquí", you: "te toca", todo: "falta" };
  const asSentence = (text) => { const t = text.charAt(0).toUpperCase() + text.slice(1); return /[.!?»]$/.test(t) ? t : t + "."; };
  function journeyView(c, d, enter) {
    const l = layerOf(c);
    const actions = c.actions.length ? h("div", { class: "row" }, c.actions.map((a) => actionButton(a, c.key))) : null;
    if (l.at < 0) return actions;
    const p = state.snap && state.snap.pipeline;
    const threshold = p && p.threshold != null ? Math.round(p.threshold) : null;
    const beyond = l.who === "done";
    const done = {
      aviso: "Guardado" + (d.first_seen ? " el " + when(d.first_seen) : "") + " desde " + c.source,
      puntaje: c.score + " de 100" + (threshold != null ? " · tu umbral es " + threshold : ""),
      cv: c.has_cv ? "CV a la medida listo" : "Listo",
      respuestas: "Formulario completo",
      compuerta: c.approved ? "Aprobada por ti" : "Pasó la revisión final",
    };
    const ol = h("ol", { class: "journey" + (enter ? " enter" : ""), "aria-label": "Las cinco capas entre el aviso y el envío" },
      LAYERS.map((ly, i) => {
        const st = beyond || i < l.at ? "done" : i === l.at ? l.who : "todo";
        const detail = st === "done" ? done[ly.id] : st === "todo" ? "" : asSentence(l.text);
        const li = h("li", { class: "j-" + st, "data-layer": ly.id, "aria-current": i === l.at && !beyond ? "step" : null },
          h("span", { class: "j-mark", "aria-hidden": "true" }),
          h("div", { class: "j-body" },
            h("div", { class: "j-name" }, ly.label, st === "you" ? h("span", { class: "chip turn" }, "Te toca") : null, h("span", { class: "sr" }, "(" + STATUS_WORD[st] + ")")),
            detail ? h("div", { class: "small muted wrap-any" }, detail) : null,
            i === l.at && !beyond ? actions : null));
        li.style.setProperty("--i", String(i));
        return li;
      }));
    const after = beyond ? h("div", { class: "j-after" }, h("div", { class: "small muted" }, "Después del envío"), stepper(c)) : null;
    return h("div", { class: "journey-box", id: "journey" }, h("h3", {}, "Recorrido"), ol, after, beyond ? actions : null);
  }

  function renderDetail() {
    const drawer = document.getElementById("detail");
    const d = state.detail;
    if (!d) { drawer.className = "detail"; drawer.replaceChildren(); return; }
    drawer.className = "detail open";
    const c = d.card;
    const snap = state.snap;
    const nowMs = snap ? Date.parse(snap.generated_at) : Date.now();
    const mails = snap ? snap.today.emails.filter((mail) => mail.job_key === c.key) : [];
    const tasks = snap ? snap.today.tasks.filter((task) => task.job_key === c.key) : [];
    let salary = "Sueldo: no publicado";
    if (d.salary_min != null || d.salary_max != null) {
      salary = "Sueldo publicado: " + [d.salary_min, d.salary_max].filter((x) => x != null).map((x) => "US$" + Math.round(x)).join(" a ") + " al mes";
    }
    const journey = journeyView(c, d, state.journeyIn);
    state.journeyIn = false;
    fill(drawer,
      h("div", { class: "row between" },
        h("h2", {}, c.company + " — " + c.title),
        h("div", { class: "row" }, seqControls(c.key), h("button", { id: "close-detail", onclick: () => closeJob() }, "Cerrar"))),
      h("p", { class: "row" }, h("span", { class: "chip" }, STATE_LABELS[c.state] || c.state),
        h("span", { class: "muted" }, "Puntaje " + c.score + ", " + d.location + (d.remote ? ", remoto" : ""))),
      h("p", { class: "muted" }, salary),
      h("p", {}, link(c.url, "Ver el aviso"), " y ", link(d.apply_url, "abrir el formulario")),
      journey,
      c.reason_short && layerOf(c).at < 0 ? h("p", {}, c.reason_short) : null,
      c.reason ? h("details", { class: "fold" }, h("summary", {}, "Texto completo del motivo"), h("pre", { class: "wrap" }, c.reason)) : null,
      c.note && !c.reason ? h("p", { class: "muted" }, "Nota: " + c.note) : null,
      tasks.length
        ? h("div", {}, h("h3", {}, "Tareas abiertas de esta postulación"),
            h("ul", {}, tasks.map((task) => h("li", {}, task.text + (task.due_at ? " (" + (countdown(task, nowMs) || { text: "" }).text.toLowerCase() + ")" : "")))))
        : null,
      mails.length
        ? h("div", {}, h("h3", {}, "Correos de esta postulación"),
            h("ul", {}, mails.map((mail) => h("li", {}, (KIND_LABELS[mail.kind] || mail.kind) + ": " + (mail.subject || "(sin asunto)") + ", " + ago(mail.received_at, nowMs)))))
        : null,
      c.has_screenshot
        ? h("div", { id: "shot-slot" }, state.shotUrl && state.shotKey === c.key ? shotImage() : h("p", { class: "muted" }, "Cargando la captura…"))
        : h("p", { class: "muted" }, "Sin captura de prueba en seco."),
      c.marks.length
        ? h("div", {},
            h("h3", {}, "Registrar una respuesta"),
            h("input", { id: "mark-note", type: "text", maxlength: "200", value: state.note,
              placeholder: "nota (por ejemplo, la fecha de la entrevista)",
              oninput: (e) => { state.note = e.target.value; } }),
            h("div", { class: "row" }, c.marks.map((m) => {
              const label = MARK_LABELS[m] || m;
              const run = (button) => markJob(c.key, m, button);
              return h("button", { "data-mark": m, onclick: PERMANENT_MARKS.includes(m) ? twoStep(label, run) : (e) => run(e.currentTarget) }, label);
            })))
        : null,
      h("h3", {}, "Historial"),
      d.events.length === 0 ? h("p", { class: "muted" }, "Sin movimientos.")
        : h("ul", { class: "timeline" }, d.events.map((e) => h("li", {},
            h("span", { class: "tl-when small muted" }, when(e.at)),
            h("span", { class: "tl-what" }, (e.from ? (STATE_LABELS[e.from] || e.from) + " a " : "") + (STATE_LABELS[e.to] || e.to) + (e.note ? ", " + e.note : ""))))),
      h("h3", {}, "Cómo se calculó el puntaje"),
      Object.keys(d.score_detail).length ? scoreBars(d.score_detail) : h("p", { class: "muted" }, "Sin detalle."),
      d.gaps.length
        ? h("div", {}, h("h3", {}, "Para repasar de esta oferta"),
            h("ul", {}, d.gaps.map((g) => h("li", {}, g.topic + (g.seen ? " (repasada)" : " (por repasar, pestaña Aprender)")))))
        : null,
      d.dossier
        ? h("details", { open: true }, h("summary", {}, "Dossier"), h("pre", { class: "wrap" }, d.dossier))
        : h("p", { class: "muted" }, "Sin dossier todavía: se escribe cuando la empresa responde."),
      h("details", {}, h("summary", {}, "Descripción del aviso"), h("pre", { class: "wrap" }, d.description)),
    );
    // the title is what travels between the row and the drawer
    const title = drawer.querySelector("h2");
    if (title) title.style.viewTransitionName = "job";
  }

  // ---- Aprender

  async function nextCard() {
    const d = state.drill;
    const r = await api("/api/learn/next" + (d.topic ? "?topic=" + encodeURIComponent(d.topic) : ""));
    if (!r.ok) { toast(said(r, "No se pudo pedir la pregunta."), false); return; }
    d.card = r.data.card;
    d.empty = !r.data.card;
    d.shown = false;
    d.answer = "";
    d.text = "";
    render();
  }

  async function revealAnswer() {
    const d = state.drill;
    if (!d.card) return;
    const r = await api("/api/learn/answer?id=" + encodeURIComponent(d.card.id));
    if (!r.ok) { toast(said(r, "No se pudo pedir la respuesta."), false); return; }
    d.answer = r.data.answer;
    d.shown = true;
    render();
  }

  async function gradeCard(grade, button) {
    const d = state.drill;
    if (!d.card) return;
    button.disabled = true;
    const r = await api("/api/learn/grade", { id: d.card.id, grade });
    toast(said(r, r.ok ? "Nota registrada." : "No se pudo registrar."), r.ok);
    if (r.ok) { d.card = null; d.shown = false; d.answer = ""; d.text = ""; d.empty = false; }
    await refresh(true);
  }

  function drillView(l) {
    const d = state.drill;
    const topics = Array.from(new Set(l.topics.map((t) => t.topic)));
    const select = h("select", { id: "topic", onchange: (e) => { d.topic = e.target.value; } },
      h("option", { value: "" }, "todos los temas"),
      topics.map((t) => h("option", { value: t, selected: t === d.topic }, t)));
    return h("section", { class: "block" },
      h("h3", {}, "Repaso"),
      h("div", { class: "row", style: null }, select,
        h("button", { id: "next-card", class: "primary", onclick: nextCard }, d.card ? "Otra pregunta" : "Siguiente pregunta")),
      d.card
        ? h("div", { class: "block card-q" },
            h("p", { class: "muted" }, d.card.topic + (d.card.offer ? ", de la oferta " + d.card.offer : "")),
            h("p", { id: "question", class: "question" }, d.card.question),
            h("p", {}, h("textarea", { id: "my-answer", rows: "4", placeholder: "Tu respuesta, antes de mirar la de referencia (no se guarda)",
              oninput: (e) => { d.text = e.target.value; } }, d.text)),
            d.shown
              ? h("div", {},
                  h("pre", { id: "answer", class: "wrap" }, d.answer),
                  h("p", {}, "¿Cómo te fue? 0 = en blanco, 5 = perfecto."),
                  h("div", { class: "row" }, [0, 1, 2, 3, 4, 5].map((g) => h("button", { "data-grade": g, onclick: (e) => gradeCard(g, e.currentTarget) }, String(g)))))
              : h("div", { class: "row" }, h("button", { id: "reveal", onclick: revealAnswer }, "Mostrar la respuesta")))
        : h("p", { id: "drill-empty", class: "empty" },
            d.empty ? "Estás al día: no hay preguntas pendientes." : "Elige un tema o pulsa «Siguiente pregunta»."));
  }

  function renderLearn() {
    const l = state.snap.learn;
    return [
      h("div", { class: "learn" },
        h("h2", {}, "Aprender"),
        h("p", { class: "lead", id: "learn-stats" }, "Vistas " + l.seen + " de " + l.total + ", pendientes hoy: " + l.due),
        drillView(l),
        h("section", { class: "block" },
          h("h3", {}, "Temas débiles"),
          l.weak_topics.length
            ? h("ul", { class: "items" }, l.weak_topics.map((t) => h("li", { class: "item plain" }, h("span", {}, t.topic), h("span", { class: "muted" }, "promedio " + t.average.toFixed(1)))))
            : h("p", { class: "empty" }, "Sin temas débiles todavía."),
          fold("progress", false, "Avance por tema",
            h("table", {}, h("tbody", {}, l.topics.map((t) => h("tr", {}, h("td", {}, t.topic), h("td", {}, t.seen + "/" + t.total), h("td", {}, t.due + " pendientes"))))))),
        h("section", { class: "block" },
          h("h3", {}, "Huecos que salen de las ofertas", h("span", { class: "count" }, String(l.gaps.length))),
          l.gaps.length === 0
            ? h("p", { class: "empty" }, "Cuando un dossier detecta algo para repasar, aparece aquí.")
            : h("ul", { class: "items" }, l.gaps.map((g) => h("li", { class: "item plain" }, h("span", {}, g.topic + ", " + g.offer), h("span", { class: "muted" }, g.seen ? "repasada" : "por repasar")))))),
    ];
  }

  // ---- Moving between things: sections, the drawer and the lists keep their place and show where they went

  function routeOfHash() {
    const m = /^#(hoy|procesos|cola|learn)(?:\/(.+))?$/.exec(location.hash);
    if (!m) return null;
    let job = null;
    try { job = m[2] ? decodeURIComponent(m[2]) : null; } catch (e) { /* a broken address is just no job */ }
    return { tab: m[1], job };
  }

  // The address says where you are, so Back and Forward walk the sections and close the drawer.
  function writeHash(push) {
    if (embedded) return false;
    const hash = "#" + state.tab + (state.openKey ? "/" + encodeURIComponent(state.openKey) : "");
    if (location.hash === hash) return false;
    if (push) history.pushState(null, "", location.pathname + hash);
    else history.replaceState(null, "", location.pathname + hash);
    return push;
  }

  // Runs a change of the page inside a view transition when the browser has them and nobody asked for
  // less motion; otherwise the change just happens. `kind` tells the style sheet which way things move.
  function transition(kind, update, origin, stops) {
    const root = document.documentElement;
    if (!document.startViewTransition || still() || state.vtBusy) { update(); return Promise.resolve(); }
    state.vtBusy = true;
    root.dataset.vt = kind;
    if (kind === "fwd" || kind === "back") root.style.setProperty("--vt-time", (0.56 + 0.12 * ((stops || 1) - 1)).toFixed(2) + "s");
    const done = () => { state.vtBusy = false; delete root.dataset.vt; };
    // The sun is aimed once the new page is in place, because the circle is measured on the new page.
    const run = () => { update(); if (kind === "sun") aimSun(origin); };
    try {
      return document.startViewTransition(run).finished.then(done, done);
    } catch (e) {
      done();
      update();
      return Promise.resolve();
    }
  }

  // A short light runs along the platform edge from the section you left to the one you chose.
  function ride(fromName, toName, ms) {
    const bar = document.getElementById("platform");
    const from = centerOf(document.querySelector('[data-tab="' + fromName + '"]'));
    const to = centerOf(document.querySelector('[data-tab="' + toName + '"]'));
    if (!bar || !from || !to || still()) return;
    const rider = h("i", { class: "rider", "aria-hidden": "true" });
    bar.append(rider);
    const run = rider.animate([
      { transform: "translateX(" + (from.x - 28) + "px)", opacity: 0 },
      { opacity: 1, offset: .18 },
      { opacity: 1, offset: .78 },
      { transform: "translateX(" + (to.x - 28) + "px)", opacity: 0 },
    ], { duration: ms, easing: "cubic-bezier(.16,1,.3,1)" });
    run.onfinish = run.oncancel = () => rider.remove();
  }

  const centerOf = (el) => {
    if (!el || !el.getBoundingClientRect) return null;
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  };

  // A circle that starts at the point you pointed at and grows until it covers the window.
  function aimSun(origin) {
    const root = document.documentElement;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const at = origin || { x: vw / 2, y: 0 };
    const box = document.querySelector("main").getBoundingClientRect();
    root.style.setProperty("--vt-x", (at.x - box.left).toFixed(0) + "px");
    root.style.setProperty("--vt-y", (at.y - box.top).toFixed(0) + "px");
    root.style.setProperty("--vt-r", Math.ceil(Math.hypot(Math.max(at.x, vw - at.x), Math.max(at.y, vh - at.y)) + 40) + "px");
  }

  // What happens to a page that was just opened: its rows come in one after another and the funnel counts.
  const ENTERING = ".ticket-wrap, .lead, li.item, li.proc, li.queue-row, .mail, .station, .block > h3, .card-q, .ticket-clear";
  function enterView(app) {
    let i = 0;
    app.querySelectorAll(ENTERING).forEach((el) => { if (el.getClientRects().length > 0) el.style.setProperty("--i", String(Math.min(i++, 16))); });
    app.querySelectorAll(".station-n").forEach((el) => el.style.setProperty("--n", el.textContent));
    app.classList.add("entering");
    clearTimeout(state.enterTimer);
    state.enterTimer = setTimeout(() => app.classList.remove("entering"), 1800);
  }

  function go(name, opts) {
    const o = opts || {};
    if (!TABS.includes(name)) return Promise.resolve();
    const prev = state.tab;
    const same = name === prev;
    if (same && !o.force) return Promise.resolve();
    state.scroll[prev] = window.scrollY;
    state.tab = name;
    if (!same && !o.silent) writeHash(true);
    const update = () => {
      if (state.snap) render({ tabChange: !same });
      if (!same) window.scrollTo(0, o.scroll != null ? o.scroll : state.scroll[name] || 0);
      if (o.then) o.then();
    };
    if (same) { update(); return Promise.resolve(); }
    const stops = Math.abs(TABS.indexOf(name) - TABS.indexOf(prev));
    const kind = o.kind || (TABS.indexOf(name) > TABS.indexOf(prev) ? "fwd" : "back");
    if (kind !== "sun") ride(prev, name, 560 + 120 * (stops - 1));
    return transition(kind, update, o.origin || centerOf(document.querySelector('[data-tab="' + name + '"]')), stops);
  }

  // The gold bar under the tabs is one piece that slides to the section you chose.
  function moveInk() {
    const nav = document.querySelector("nav.tabs");
    if (!nav) return;
    let ink = nav.querySelector(".tab-ink");
    const created = !ink;
    if (!ink) { ink = h("i", { class: "tab-ink", "aria-hidden": "true" }); nav.append(ink); ink.style.transition = "none"; }
    const on = nav.querySelector('[aria-selected="true"]');
    if (!on) return;
    ink.style.transform = "translateX(" + on.offsetLeft + "px)";
    ink.style.width = on.offsetWidth + "px";
    if (created) { void ink.offsetWidth; ink.style.transition = ""; }
  }

  // Rows that change place glide to it instead of jumping (a filter, a new order, an approval that
  // leaves the list shorter). Nothing glides when the tab itself changed or when the page is hidden.
  const flipKey = (el) => (el.dataset.card ? "c:" + el.dataset.card : el.dataset.task ? "t:" + el.dataset.task : null);
  function rectsOf(app) {
    const out = new Map();
    app.querySelectorAll("[data-card], [data-task]").forEach((el) => {
      const key = flipKey(el);
      const box = el.getBoundingClientRect();
      if (key && box.width > 0 && !out.has(key)) out.set(key, box);
    });
    return out;
  }
  function glide(before, app) {
    if (still() || before.size === 0) return;
    app.querySelectorAll("[data-card], [data-task]").forEach((el) => {
      const was = before.get(flipKey(el));
      if (!was) return;
      const now = el.getBoundingClientRect();
      const dx = was.left - now.left;
      const dy = was.top - now.top;
      if (Math.abs(dx) + Math.abs(dy) < 2 || Math.abs(dy) > window.innerHeight * 1.5) return;
      el.animate([{ transform: "translate(" + dx + "px," + dy + "px)" }, { transform: "none" }], { duration: 340, easing: "cubic-bezier(.23,1,.32,1)" });
    });
  }

  // Points at a thing the page just took you to.
  function locate(el) {
    if (!el) return;
    el.scrollIntoView({ block: "start", behavior: still() ? "auto" : "smooth" });
    el.classList.remove("locate");
    void el.offsetWidth;
    el.classList.add("locate");
    setTimeout(() => el.classList.remove("locate"), 1800);
  }

  // The board's numbers are doors: each one takes you to the list it counts.
  function jump(target, origin) {
    if (target === "turn") return go("hoy", { force: true, origin, kind: "sun", then: () => locate(document.getElementById("ticket")) });
    if (target === "approve") {
      return go("hoy", { force: true, origin, kind: "sun", then: () => {
        const fold = document.querySelector('[data-fold="dec-approve"]');
        if (fold) { fold.open = true; locate(fold); } else locate(document.getElementById("decisions"));
      } });
    }
    if (target === "wait" || target === "stale") {
      state.filter = target;
      return go("procesos", { force: true, origin, kind: "sun", then: () => locate(document.querySelector("#app .filters")) });
    }
    return Promise.resolve();
  }

  // The keyboard's place in a list: j and k move it, Enter opens what it is on.
  const rowKey = (el) => (el.dataset.card ? "c:" + el.dataset.card : "t:" + el.dataset.task);
  const cursorRows = () => Array.from(document.querySelectorAll("#app li[data-card], #app li[data-task]")).filter((el) => el.getClientRects().length > 0);
  function applyCursor() {
    document.querySelectorAll("#app li.cur").forEach((el) => el.classList.remove("cur"));
    if (!state.cursor) return;
    const el = cursorRows().find((row) => rowKey(row) === state.cursor);
    if (el) el.classList.add("cur"); else state.cursor = null;
  }
  function moveCursor(step) {
    const rows = cursorRows();
    if (rows.length === 0) return;
    let at = rows.findIndex((row) => rowKey(row) === state.cursor);
    at = at < 0 ? (step > 0 ? 0 : rows.length - 1) : Math.min(rows.length - 1, Math.max(0, at + step));
    state.cursor = rowKey(rows[at]);
    applyCursor();
    rows[at].scrollIntoView({ block: "nearest", behavior: still() ? "auto" : "smooth" });
  }
  function openCursor() {
    const el = state.cursor ? cursorRows().find((row) => rowKey(row) === state.cursor) : null;
    if (!el) return false;
    if (el.dataset.card) { openJob(el.dataset.card, el.querySelector("[data-open]")); return true; }
    const done = el.querySelector("[data-done]");
    if (done) { done.focus(); return true; }
    return false;
  }

  // Applications in the order the list behind the drawer shows them, so the drawer can step through them.
  const jobKeys = () => Array.from(new Set(Array.from(document.querySelectorAll("#app [data-open]")).map((b) => b.dataset.open)));
  function stepJob(dir) {
    const keys = jobKeys();
    const at = keys.indexOf(state.openKey);
    if (at < 0 || keys.length < 2) return;
    const next = keys[(at + dir + keys.length) % keys.length];
    state.cursor = "c:" + next;
    applyCursor();
    const row = document.querySelector("#app li.cur");
    if (row) row.scrollIntoView({ block: "nearest", behavior: still() ? "auto" : "smooth" });
    openJob(next, null, dir > 0 ? "next" : "prev");
  }
  function seqControls(key) {
    const keys = jobKeys();
    const at = keys.indexOf(key);
    if (at < 0 || keys.length < 2) return null;
    return h("span", { class: "seq" },
      h("button", { id: "seq-prev", title: "Anterior (k)", "aria-label": "Postulación anterior", onclick: () => stepJob(-1) }, "‹"),
      h("span", { "aria-live": "polite" }, (at + 1) + " de " + keys.length),
      h("button", { id: "seq-next", title: "Siguiente (j)", "aria-label": "Postulación siguiente", onclick: () => stepJob(1) }, "›"));
  }

  // A car on the map and its row in the table are the same application: pointing at one lights the other.
  function linkHover(root) {
    const set = (key, on) => {
      if (!key) return;
      root.querySelectorAll('[data-car="' + CSS.escape(key) + '"], .proc[data-card="' + CSS.escape(key) + '"]').forEach((el) => el.classList.toggle("hl", on));
    };
    const keyOf = (node) => {
      const el = node && node.closest ? node.closest("[data-car], .proc[data-card]") : null;
      return el ? el.dataset.car || el.dataset.card : null;
    };
    root.addEventListener("pointerover", (e) => set(keyOf(e.target), true));
    root.addEventListener("pointerout", (e) => set(keyOf(e.target), false));
    root.addEventListener("focusin", (e) => set(keyOf(e.target), true));
    root.addEventListener("focusout", (e) => set(keyOf(e.target), false));
  }

  // The shortcuts, one key press away.
  let keysBox = null;
  function closeKeys() { if (keysBox) { keysBox.remove(); keysBox = null; } }
  // Theme: the system's until someone chooses; the choice (T or the button) is kept on this machine.
  const THEMES = ["auto", "light", "dark"];
  const THEME_NAMES = { auto: "automático", light: "claro", dark: "oscuro" };
  function cycleTheme() {
    const root = document.documentElement;
    const now = root.getAttribute("data-theme") || "auto";
    const next = THEMES[(THEMES.indexOf(now) + 1) % THEMES.length];
    if (next === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", next);
    try { if (next === "auto") localStorage.removeItem("panel.theme"); else localStorage.setItem("panel.theme", next); } catch (e) { /* no storage */ }
    toast("Tema " + THEME_NAMES[next], true);
  }

  function toggleKeys() {
    if (keysBox) { closeKeys(); return; }
    const rows = [["1 – 4", "Hoy, Procesos, Cola, Aprender"], ["j  k", "Moverte por la lista"], ["Enter", "Abrir la postulación"],
      ["j  k", "Con el detalle abierto: la siguiente o la anterior"], ["Ctrl K  /", "Buscar"], ["t", "Tema: automático, claro u oscuro"], ["Esc", "Cerrar"], ["?", "Esta ayuda"]];
    keysBox = h("div", { class: "keys", role: "dialog", "aria-label": "Atajos de teclado" },
      h("h3", {}, "Atajos"),
      h("dl", {}, rows.map(([k, text]) => [h("dt", {}, h("kbd", {}, k)), h("dd", {}, text)])));
    keysBox.addEventListener("click", closeKeys);
    document.body.append(keysBox);
  }

  document.addEventListener("keydown", (e) => {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || palette.box) return;
    if (e.key === "Escape") {
      if (keysBox) closeKeys();
      else if (state.openKey) closeJob();
      else if (state.cursor) { state.cursor = null; applyCursor(); }
      return;
    }
    const t = e.target;
    if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
    const key = e.key;
    if (key >= "1" && key <= "4") { e.preventDefault(); go(TABS[Number(key) - 1]); return; }
    if (key === "?") { e.preventDefault(); toggleKeys(); return; }
    if (key === "t") { e.preventDefault(); cycleTheme(); return; }
    if (state.openKey) {
      if (key === "j" || key === "]") { e.preventDefault(); stepJob(1); }
      else if (key === "k" || key === "[") { e.preventDefault(); stepJob(-1); }
      return;
    }
    if (key === "j") { e.preventDefault(); moveCursor(1); }
    else if (key === "k") { e.preventDefault(); moveCursor(-1); }
    else if (key === "Enter" && state.cursor && (t === document.body || t === document.documentElement)) { if (openCursor()) e.preventDefault(); }
  });

  window.addEventListener("popstate", () => {
    if (state.ignorePop > 0) { state.ignorePop -= 1; return; }
    const route = routeOfHash() || { tab: "hoy", job: null };
    if (route.tab !== state.tab) go(route.tab, { silent: true });
    if (route.job && route.job !== state.openKey) openJob(route.job);
    else if (!route.job && state.openKey) closeJob({ fromPop: true });
  });

  // ---- The command palette: Ctrl+K (or "/") to jump to a section or straight to an application

  const palette = { box: null, input: null, list: null, items: [], at: 0, from: null };

  function paletteItems(query) {
    const items = [];
    for (const [id, label] of [["hoy", "Hoy"], ["procesos", "Procesos"], ["cola", "Cola"], ["learn", "Aprender"]]) {
      items.push({ kind: "Ir a", text: label, run: () => selectTab(id) });
    }
    if (state.snap) {
      for (const col of state.snap.board) {
        for (const c of col.cards) items.push({ kind: STATE_LABELS[c.state] || c.state, text: c.company + " — " + c.title, extra: c.source, run: () => openJob(c.key) });
      }
    }
    const words = norm(query).split(/\s+/).filter(Boolean);
    return items.filter((it) => words.every((w) => norm(it.kind + " " + it.text).includes(w))).slice(0, 12);
  }

  function markPalette() {
    Array.from(palette.list.children).forEach((li, i) => {
      li.classList.toggle("on", i === palette.at);
      li.setAttribute("aria-selected", String(i === palette.at));
    });
    palette.input.setAttribute("aria-activedescendant", palette.items.length ? "pal-" + palette.at : "");
    const on = palette.list.children[palette.at];
    if (on && on.scrollIntoView) on.scrollIntoView({ block: "nearest" });
  }

  function paintPalette() {
    palette.items = paletteItems(palette.input.value);
    palette.at = Math.min(palette.at, Math.max(0, palette.items.length - 1));
    fill(palette.list, ...(palette.items.length
      ? palette.items.map((it, i) => h("li", { id: "pal-" + i, role: "option", class: "pal-item",
          onclick: () => runPalette(i), onmousemove: () => { if (palette.at !== i) { palette.at = i; markPalette(); } } },
          h("span", { class: "pal-kind" }, it.kind), h("span", { class: "pal-text" }, it.text), it.extra ? h("span", { class: "pal-extra" }, it.extra) : null))
      : [h("li", { class: "pal-empty" }, "Nada coincide.")]));
    markPalette();
  }

  function closePalette() {
    if (!palette.box) return;
    palette.box.remove();
    palette.box = null;
    if (palette.from && palette.from.isConnected && palette.from.focus) palette.from.focus({ preventScroll: true });
  }

  function runPalette(i) {
    const it = palette.items[i];
    if (!it) return;
    closePalette();
    it.run();
  }

  function openPalette() {
    if (palette.box) { palette.input.focus(); return; }
    palette.from = document.activeElement;
    palette.at = 0;
    palette.input = h("input", { id: "palette-input", type: "text", role: "combobox", "aria-expanded": "true", "aria-controls": "palette-list",
      "aria-label": "Buscar", autocomplete: "off", spellcheck: "false", placeholder: "Busca una postulación o una sección",
      oninput: () => { palette.at = 0; paintPalette(); } });
    palette.list = h("ul", { id: "palette-list", role: "listbox", class: "pal-list" });
    palette.box = h("div", { class: "pal-back", onmousedown: (e) => { if (e.target === palette.box) closePalette(); } },
      h("div", { class: "pal", role: "dialog", "aria-modal": "true", "aria-label": "Buscar" },
        palette.input, palette.list, h("div", { class: "pal-foot" }, "Flechas para moverte, Enter para ir, Esc para cerrar")));
    palette.input.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { e.preventDefault(); palette.at = Math.min(palette.at + 1, palette.items.length - 1); markPalette(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); palette.at = Math.max(palette.at - 1, 0); markPalette(); }
      else if (e.key === "Enter") { e.preventDefault(); runPalette(palette.at); }
      else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closePalette(); }
      else if (e.key === "Tab") e.preventDefault();
    });
    document.body.append(palette.box);
    paintPalette();
    palette.input.focus();
  }

  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); return; }
    const t = e.target;
    const typingNow = t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
    if (e.key === "/" && !typingNow && !palette.box && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); openPalette(); }
  });

  const tabButtons = Array.from(document.querySelectorAll("[data-tab]"));
  const selectTab = (name) => go(name);
  tabButtons.forEach((b) => b.addEventListener("click", () => selectTab(b.dataset.tab)));
  // Arrow keys, Home and End move between the tabs, as in any tab list.
  document.querySelector("nav.tabs").addEventListener("keydown", (e) => {
    const i = tabButtons.indexOf(document.activeElement);
    if (i < 0) return;
    let next = -1;
    if (e.key === "ArrowRight") next = (i + 1) % tabButtons.length;
    else if (e.key === "ArrowLeft") next = (i - 1 + tabButtons.length) % tabButtons.length;
    else if (e.key === "Home") next = 0;
    else if (e.key === "End") next = tabButtons.length - 1;
    if (next < 0) return;
    e.preventDefault();
    selectTab(tabButtons[next].dataset.tab);
    tabButtons[next].focus();
  });
  buildBoard();
  linkHover(document.getElementById("app"));
  window.addEventListener("resize", moveInk);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveInk);
  refresh(true).then((ok) => {
    if (!ok) return;
    if (startRoute && startRoute.job) openJob(startRoute.job);
    else writeHash(false);
  });
  setInterval(() => { if (document.visibilityState === "visible") refresh(false); }, 30000);
})();
</script>
</body>
</html>
