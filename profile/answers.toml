# A yes/no question about pay ("Do you meet the salary requirements?", "Is the posted range in line with
# your expectations?") is not a figure: "USD 6,000 per month" would be an invented answer. Unanswered, ahead
# of every salary answer.
[[entry]]
patterns = [
  "meet|meets|satisfy|satisfies|acceptable|comfortable|okay with|ok with|fine with|in line with|aligned with|align with|within the&salary|compensation|pay",
]

# Two figures are asked and one is the CURRENT salary ("Please state your current and expected salary"):
# the expectation alone would assert a current salary the user never gave. Unanswered.
[[entry]]
patterns = [
  "current and expected", "current and desired", "current and target", "current and required",
  "current or expected", "current or desired", "current expected", "current desired",
  "current vs expected", "current versus expected", "previous and expected",
  "previous and desired", "present and expected", "last and expected", "and expected salary",
  "and desired salary", "and target salary", "and expected compensation",
  "and desired compensation", "and target compensation",
]

# Units: a field "in thousands of USD" / "(k USD)" / "($000s)" wants the figure in thousands, not 72000 (a
# 1000x error): 6 for a monthly figure and 72 for a yearly one, which is also assumed when the field names no
# period. Only for the EXPECTATION (the words below): the current salary and the other cases stay unanswered
# further down. These go after "current and expected".
[[entry]]
patterns = [
  "thousand|000s|1000s|in 000|k usd|usd k|in k|k$&monthly|per month|a month|each month&salary expectation|expected salary|desired salary|salary requirement|compensation expectation|expected compensation|desired compensation|compensation requirement|expected pay|desired pay|pay expectation|pay requirement|target salary|target compensation|expected base salary|desired base salary|expected monthly|desired monthly|salary you are looking for|salary are you looking for|salary you are seeking",
]
value = "6"

[[entry]]
patterns = [
  "thousand|000s|1000s|in 000|k usd|usd k|in k|k$&salary expectation|expected salary|desired salary|salary requirement|compensation expectation|expected compensation|desired compensation|compensation requirement|expected pay|desired pay|pay expectation|pay requirement|target salary|target compensation|expected base salary|desired base salary|expected annual|desired annual|annual salary expectation|annual compensation expectation|salary you are looking for|salary are you looking for|salary you are seeking",
]
