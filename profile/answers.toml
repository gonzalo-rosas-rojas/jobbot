# 2. Blocks WITHOUT an answer (on purpose): questions that a broader entry would answer wrongly.
# ---------------------------------------------------------------------------------------------

# Someone else's details: never the user's (references, manager, emergency contact, family, recruiter).
[[entry]]
patterns = [
  "reference", "referee", "referral", "referrer", "referred", "emergency", "supervisor",
  "manager", "recruiter", "colleague", "spouse", "mother", "father", "parent", "family member",
  "relative", "next of kin", "beneficiary", "dependent", "hr contact",
]

# Work or company contact details: the user's email and phone are personal ones.
[[entry]]
patterns = [
  "work phone", "work email", "work telephone", "work number", "office phone", "office email",
  "business phone", "business email", "company phone", "company email", "company contact",
  "corporate email", "employer phone", "employer email", "employer contact", "home phone",
  "email address of", "phone number of", "contact number of",
]

# Names other than the current one, and signatures: the bot never signs anything.
[[entry]]
patterns = [
  "maiden", "former name", "previous name", "other name", "former last name", "previous last name",
  "former first name", "previous first name", "former surname", "previous surname", "alias",
  "also known as", "signature", "sign", "full name of",
]

# "Applicant's name", "Candidate's phone"...: the possessive belongs to the applicant, that is, the user.
# These go BEFORE the block below, which catches "s name", "s phone" and "s email" of any other owner;
