# "It depends, I prefer remote". A yes/no field (radio or dropdown) has no such option, so a required one
# moves to needs_gonza; a text field gets the phrase as is. Only for questions about WILLINGNESS to move: a
# bare "relocate" appears in "Do you plan to relocate?", "Which city would you relocate from?", "If you would
# need to relocate, please describe...". It goes before the location entry: "willing to relocate from your
# current location" is this question.
[[entry]]
patterns = [
  "willing to relocate", "willing to relocation", "open to relocation", "open to relocating",
  "open to relocate", "willingness to relocate",
]
value = "Prefer remote; open to discussing relocation depending on the role"

