# Form answer bank. An entry without `value` means "ask the user": the application moves to needs_gonza.
# Entries are tried in order: the most specific goes first.
# A pattern matches whole words of the label, ignoring case and punctuation. A pattern that starts with = must
# match the entire label ("=name" takes "Name *", not "Company name"). Bare generic words (city, country, phone,
# email, race...) always go with = or inside a phrase: they appear in questions that are not that field
# ("Foster City", "race conditions", "mobile development").
# Three more operators (src/answers.rs, `lookup`): a phrase ending in $ must be the END of the label
# ("reside in$" does not take "reside in and in the US"); several phrases joined by | are alternatives; several
# terms joined by & must all hold ("a|b&c|d" = (a or b) and (c or d)). An empty term (a stray & or |) matches
# nothing: a typo only narrows the pattern.
# `alternatives`: other option texts tried, in order, when the field is a dropdown and the `value` option does
# not exist at that company.
# For yes/no questions (radio or dropdown), `value` must be the text of an option ("No", "Yes").
#
# Order of the file: (1) work/visa answers about the country where the user lives, (2) blocks WITHOUT an answer
# that stop risky questions before a broad entry answers them, (3) the answers. The tests in src/answers.rs
# (module `audit`) pin every label.
#
# THIS FILE IS AN EXAMPLE for a fictional person (Jane Doe). Replace every personal value (name, email, phone,
# links, school, jobs, salary) with your own, and keep sensitive self-identification (gender, race, religion,
# orientation, pronouns, veteran, disability...) empty unless you want the program to answer it.
#
# consent_checkboxes: phrases that authorize ticking a REQUIRED checkbox whose text contains them (privacy
# notice, consent to process the application). Empty = none is ticked and the application goes to needs_gonza.
# Even if the checkbox contains one of these phrases it is not ticked when it also accepts arbitration, terms
# and conditions, marketing, SMS, background checks or future offers (fixed list in src/answers.rs). It is also
# a whitelist: after removing the phrase from the label, every remaining word must be filler ("I have read and
# agree to the ..."), part of a URL or a company possessive ("Cloudflare's"). An unknown word ("... and
# AI-assisted screening", "... for other vacancies", "... Acme Privacy Policy") leaves the box unticked.
consent_checkboxes = ["privacy policy", "privacy notice", "consent to the processing"]

# ---------------------------------------------------------------------------------------------
# 1. Authorization and visa, only when the question is about the country where the user lives (Chile in this
#    example): there the honest answer is clear. These go before the unanswered blocks so they win. Two guards
#    against COMPOUND questions ("... where you live and in the country of the job"), which also ask about
#    another country and have no honest one-word answer:
#    - the unanswered block below catches the words that name the other country;
#    - every phrase ends in $: it must be the end of the label, so any new tail ("... and in the US",
#      "... or where the job is") stops matching and the question falls into the legal block of section 2.
# ---------------------------------------------------------------------------------------------
# Authorization and visa questions that name a specific place go UNANSWERED here (the program asks the user):
# whether sponsorship is needed depends on the posting, not on the label. For postings that are open only
# through `extra_open_places` in criteria.toml, the engine answers with the user's actual work-rights facts
# (`bank_for_job` in src/pipeline.rs). This entry stays as a safety net for whatever arrives another way.
[[entry]]
patterns = [
  "australia|australian|sydney|melbourne|brisbane|perth|adelaide|canberra&sponsor|sponsorship|sponsored|authorized|authorised|authorization|authorisation|eligible|eligibility|entitled|permitted|right to work|work rights|working rights|visa|work permit|citizen|citizenship|permanent resident",
]

# Work authorization and sponsorship for a user who works as a contractor from their own country: authorization
# for the United States is "No" and any visa sponsorship question is "No". Two questions in one ("... in your
# country AND in the US", "authorized ... and do you require sponsorship?") stay unanswered: a single word
# would be half the truth.
