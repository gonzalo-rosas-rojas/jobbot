# Fields that only mention moving: an address ("What is the address from which you plan on working? If you
# would need to relocate, please type "relocating""), a location plus another question ("current location
# and are you open to relocate?"), an instruction to type a word. The prose below answers none of them.
# Unanswered on purpose.
[[entry]]
patterns = [
  "address", "work from", "please type", "type relocating", "type in", "current location and",
]

# Willingness to relocate to the places in `extra_open_places` (criteria.toml): Yes. Relocation help
# (assistance, package, bonus...) was left unanswered above. This goes before "Depends, I prefer remote",
# which would answer that to a question about those places.
[[entry]]
patterns = [
  "willing to relocate|willing to move|willing to relocation|open to relocating|open to relocation|open to relocate|willingness to relocate|prepared to relocate|able to relocate|ready to relocate|happy to relocate|relocate to&australia|australian|sydney|melbourne|brisbane|perth|adelaide|canberra",
]
value = "Yes"
