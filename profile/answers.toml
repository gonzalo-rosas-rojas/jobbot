e usa$",
  "authorized to work in the united states|authorized to work in the united states of america|authorized to work in the u s|authorized to work in the us|authorized to work in the u s a|authorized to work in the usa|authorised to work in the united states|authorised to work in the united states of america|authorised to work in the u s|authorised to work in the us|authorised to work in the u s a|authorised to work in the usa|eligible to work in the united states|eligible to work in the united states of america|eligible to work in the u s|eligible to work in the us|eligible to work in the u s a|eligible to work in the usa|legal right to work in the united states|legal right to work in the united states of america|legal right to work in the u s|legal right to work in the us|legal right to work in the u s a|legal right to work in the usa|right to work in the united states|right to work in the united states of america|right to work in the u s|right to work in the us|right to work in the u s a|right to work in the usa|legally permitted to work in the united states|legally permitted to work in the united states of america|legally permitted to work in the u s|legally permitted to work in the us|legally permitted to work in the u s a|legally permitted to work in the usa|legally entitled to work in the united states|legally entitled to work in the united states of america|legally entitled to work in the u s|legally entitled to work in the us|legally entitled to work in the u s a|legally entitled to work in the usa|work authorization in the united states|work authorization in the united states of america|work authorization in the u s|work authorization in the us|work authorization in the u s a|work authorization in the usa|work authorisation in the united states|work authorisation in the united states of america|work authorisation in the u s|work authorisation in the us|work authorisation in the u s a|work authorisation in the usa&without sponsorship|without visa sponsorship|without requiring|without the need|without needing|without employer|without employment sponsorship|without any sponsorship|not require sponsorship|not require visa|not need sponsorship|not need visa|no need for sponsorship|no sponsorship",
]
