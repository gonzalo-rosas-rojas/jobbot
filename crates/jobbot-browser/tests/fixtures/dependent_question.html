<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply - a question that opens another (test fixture)</title></head>
<body>
<!-- Nothing here is sent anywhere. Answering "Yes" to the referral question opens a required
     question, as many boards do; it is not on the page when the form is first read. The new
     question sits in the middle of the form, so the numbers a scan gives the controls below it
     change when the page is read again. -->
<h1>Apply for Senior AI Engineer</h1>
<form id="app" onsubmit="return false">
  <div><label for="first_name">First name *</label> <input id="first_name" name="first_name" type="text" required></div>
  <fieldset>
    <legend>Do you have a referral? *</legend>
    <label><input type="radio" name="referral" value="yes"> Yes</label>
    <label><input type="radio" name="referral" value="no"> No</label>
  </fieldset>
  <div id="more"></div>
  <div><label for="phone">Phone</label> <input id="phone" name="phone" type="tel"></div>
  <div><label for="resume">Resume/CV *</label> <input id="resume" name="resume" type="file" required></div>
  <button type="submit" id="send">Submit application</button>
</form>
<script>
  document.querySelectorAll('input[name="referral"]').forEach((radio) => {
    radio.addEventListener('change', () => {
      document.getElementById('more').innerHTML = radio.value === 'yes'
        ? '<div><label for="who">Describe your referral *</label> <textarea id="who" name="who" required></textarea></div>'
        : '';
    });
  });
</script>
</body>
</html>
