<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply - Greenhouse job-boards structure (test fixture)</title>
<style>
  /* What the board's stylesheet does that matters to the scan: react-select's shadow input is
     invisible but still laid out (so it has an offsetParent), file inputs are visually hidden. */
  .select-shell { position: relative; }
  .remix-css-1a0ro4n-requiredInput { opacity: 0; width: 100%; height: 0; position: absolute; bottom: 0; left: 0; pointer-events: none; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<!--
  Structure copied from real job-boards.greenhouse.io forms (Gusto, Glean, Databricks), cut down to
  one example of every kind of control. Every question is public text from the posting; there is
  nothing personal here. The page never submits anything.
-->
<form id="application-form" class="application--form">
  <div class="application--questions">
    <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
      <label id="first_name-label" for="first_name" class="label label">First Name<span aria-hidden="true">*</span></label>
      <input id="first_name" class="input input__single-line" aria-label="First Name" aria-required="true" type="text">
    </div></div></div>
    <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
      <label id="preferred_name-label" for="preferred_name" class="label label">Preferred First Name</label>
      <input id="preferred_name" class="input input__single-line" aria-label="Preferred First Name" aria-required="false" type="text">
    </div></div></div>
    <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
      <label id="email-label" for="email" class="label label">Email<span aria-hidden="true">*</span></label>
      <input id="email" class="input input__single-line" aria-label="Email" aria-required="true" type="text">
    </div></div></div>

    <div>
      <fieldset class="phone-input">
        <legend class="visually-hidden">Phone</legend>
        <div class="phone-input__country"><div class="select"><div class="select__container">
          <label id="country-label" for="country" class="label select__label">Country<span aria-hidden="true">*</span></label>
          <div class="select-shell remix-css-b62m3t-container">
            <div><div class="select__control"><div class="select__value-container">
              <div class="select__placeholder" id="react-select-country-placeholder"></div>
              <div class="select__input-container">
                <input class="select__input" autocomplete="off" id="country" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="country-label" aria-required="true" role="combobox" aria-describedby="react-select-country-placeholder" value="">
              </div>
            </div></div></div>
            <input required tabindex="-1" aria-hidden="true" class="remix-css-1a0ro4n-requiredInput" value="">
          </div>
        </div></div></div>
        <div class="phone-input__phone"><div class="text-input-wrapper"><div class="input-wrapper">
          <label id="phone-label" for="phone" class="label label">Phone<span aria-hidden="true">*</span></label>
          <input id="phone" class="input input__single-line" aria-label="Phone" aria-required="true" type="tel">
        </div></div></div>
      </fieldset>
    </div>

    <div class="field-wrapper"><div class="select"><div class="select__container">
      <label id="candidate-location-label" for="candidate-location" class="label select__label">Location (City)<span aria-hidden="true">*</span></label>
      <div class="select-shell remix-css-b62m3t-container">
        <div><div class="select__control"><div class="select__value-container">
          <div class="select__input-container">
            <input class="select__input" autocomplete="off" id="candidate-location" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="candidate-location-label" aria-required="true" role="combobox" value="">
          </div>
        </div></div></div>
        <input required tabindex="-1" aria-hidden="true" class="remix-css-1a0ro4n-requiredInput" value="">
      </div>
    </div></div></div>

    <div class="field-wrapper">
      <div role="group" aria-labelledby="upload-label-resume" aria-required="true" class="file-upload">
        <div id="upload-label-resume" class="label upload-label">Resume/CV<span class="required">*</span></div>
        <div class="file-upload__wrapper"><div class="button-container"><div class="secondary-button"><div>
          <button type="button" class="btn btn--pill">Attach</button>
          <label class="visually-hidden" for="resume">Attach</label>
          <input id="resume" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf">
        </div></div>
        <div class="secondary-button"><button type="button" class="btn btn--pill" data-testid="resume-dropbox">Dropbox</button></div>
        <div class="secondary-button"><div>
          <button type="button" class="btn btn--pill" data-testid="resume-text">Enter manually</button>
          <label class="visually-hidden" for="resume_text">Enter manually</label>
        </div></div></div></div>
      </div>
    </div>
    <div class="field-wrapper">
      <div role="group" aria-labelledby="upload-label-cover_letter" aria-required="false" class="file-upload">
        <div id="upload-label-cover_letter" class="label upload-label">Cover Letter</div>
        <div class="file-upload__wrapper"><div class="button-container"><div class="secondary-button"><div>
          <button type="button" class="btn btn--pill">Attach</button>
          <label class="visually-hidden" for="cover_letter">Attach</label>
          <input id="cover_letter" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf">
        </div></div></div></div>
      </div>
    </div>
  </div>

  <div class="education--container"><div class="education--form">
    <p class="body body--medium">Education</p>
    <div class="select"><div class="select__container">
      <label id="school--0-label" for="school--0" class="label select__label">School<span aria-hidden="true">*</span></label>
      <div class="select-shell remix-css-b62m3t-container"><div><div class="select__control"><div class="select__value-container"><div class="select__input-container">
        <input class="select__input" autocomplete="off" id="school--0" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="school--0-label" aria-required="true" role="combobox" value="">
      </div></div></div></div><input required tabindex="-1" aria-hidden="true" class="remix-css-1a0ro4n-requiredInput" value=""></div>
    </div></div>
    <div class="select"><div class="select__container">
      <label id="degree--0-label" for="degree--0" class="label select__label">Degree<span aria-hidden="true">*</span></label>
      <div class="select-shell remix-css-b62m3t-container"><div><div class="select__control"><div class="select__value-container"><div class="select__input-container">
        <input class="select__input" autocomplete="off" id="degree--0" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="degree--0-label" aria-required="true" role="combobox" value="">
      </div></div></div></div><input required tabindex="-1" aria-hidden="true" class="remix-css-1a0ro4n-requiredInput" value=""></div>
    </div></div>
    <div class="select"><div class="select__container">
      <label id="discipline--0-label" for="discipline--0" class="label select__label">Discipline<span aria-hidden="true">*</span></label>
      <div class="select-shell remix-css-b62m3t-container"><div><div class="select__control"><div class="select__value-container"><div class="select__input-container">
        <input class="select__input" autocomplete="off" id="discipline--0" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="discipline--0-label" aria-required="true" role="combobox" value="">
      </div></div></div></div><input required tabindex="-1" aria-hidden="true" class="remix-css-1a0ro4n-requiredInput" value=""></div>
    </div></div>
    <button class="add-another-button" type="button">Add another</button>
  </div></div>

  <div class="application--questions">
    <hr>
    <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
      <label id="question_1-label" for="question_1" class="label label">LinkedIn Profile</label>
      <input id="question_1" class="input input__single-line" aria-label="LinkedIn Profile" aria-required="false" type="text">
    </div></div></div>

    <!-- A required checkbox group: one fieldset, every input carries `required`, the legend ends in a star. -->
    <div class="field-wrapper">
      <fieldset class="checkbox" id="question_2[]" aria-required="true">
        <legend class="label checkbox__description">How did you hear about this opportunity? (select all that apply)<!-- --> <span class="required">*</span></legend>
        <div class="checkbox__wrapper"><div class="checkbox__input"><input description="How did you hear about this opportunity? (select all that apply)" required type="checkbox" id="question_2[]_1" name="question_2[]" value="1"></div><label for="question_2[]_1">LinkedIn</label></div>
        <div class="checkbox__wrapper"><div class="checkbox__input"><input description="How did you hear about this opportunity? (select all that apply)" required type="checkbox" id="question_2[]_2" name="question_2[]" value="2"></div><label for="question_2[]_2">Glassdoor</label></div>
        <div class="checkbox__wrapper"><div class="checkbox__input"><input description="How did you hear about this opportunity? (select all that apply)" required type="checkbox" id="question_2[]_3" name="question_2[]" value="3"></div><label for="question_2[]_3">Indeed</label></div>
      </fieldset>
    </div>
    <!-- Export-control residence question (Databricks style). -->
    <div class="field-wrapper">
      <fieldset class="checkbox" id="question_3[]" aria-required="true">
        <legend class="label checkbox__description">Please confirm whether any of the below applies to you.  Select all that apply.<!-- --> <span class="required">*</span></legend>
        <div class="checkbox__wrapper"><div class="checkbox__input"><input required type="checkbox" id="question_3[]_1" name="question_3[]" value="1"></div><label for="question_3[]_1">Citizen or permanent resident of a restricted country</label></div>
        <div class="checkbox__wrapper"><div class="checkbox__input"><input required type="checkbox" id="question_3[]_2" name="question_3[]" value="2"></div><label for="question_3[]_2">None of the above</label></div>
      </fieldset>
    </div>
    <!-- A group with a single option: a legend and an acknowledgement. -->
    <div class="field-wrapper">
      <fieldset class="checkbox" id="question_4[]" aria-required="true">
        <legend class="label checkbox__description">Point of Data Transfer<!-- --> <span class="required">*</span></legend>
        <div class="checkbox__wrapper"><div class="checkbox__input"><input required type="checkbox" id="question_4[]_1" name="question_4[]" value="1"></div><label for="question_4[]_1">Acknowledge</label></div>
      </fieldset>
    </div>

    <div class="field-wrapper"><div class="select"><div class="select__container">
      <label id="question_5-label" for="question_5" class="label select__label">Will you need sponsorship now or in the future? <span aria-hidden="true">*</span></label>
      <div class="select-shell remix-css-b62m3t-container"><div><div class="select__control"><div class="select__value-container"><div class="select__input-container">
        <input class="select__input" autocomplete="off" id="question_5" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="question_5-label" aria-required="true" role="combobox" value="">
      </div></div></div></div><input required tabindex="-1" aria-hidden="true" class="remix-css-1a0ro4n-requiredInput" value=""></div>
    </div></div></div>

    <!-- A multi-select that is optional: no shadow input, aria-required false. -->
    <div class="field-wrapper"><div class="select"><div class="select__container">
      <label id="question_6-label" for="question_6" class="label select__label">Which of the following most influenced your decision to apply? Select all that apply.</label>
      <div class="select-shell remix-css-b62m3t-container"><div><div class="select__control"><div class="select__value-container"><div class="select__input-container">
        <input class="select__input" autocomplete="off" id="question_6" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="question_6-label" aria-required="false" role="combobox" value="">
      </div></div></div></div></div>
    </div></div></div>

    <div class="field-wrapper field-wrapper--multiline"><div class="text-input-wrapper"><div class="input-wrapper input-wrapper__multi-line">
      <label id="question_7-label" for="question_7" class="label label">Compensation Expectations<span aria-hidden="true">*</span></label>
      <textarea id="question_7" class="input input__multi-line" aria-label="Compensation Expectations" aria-required="true" rows="4"></textarea>
    </div></div></div>
  </div>
  <div class="application--submit"><button type="submit" class="btn btn--pill" aria-disabled="false" onclick="return false">Submit application</button></div>
</form>
</body>
</html>
