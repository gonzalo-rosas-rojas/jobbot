[package]
name = "jobbot-browser"
description = "jobbot's browser: the Playwright code that fills application forms, inspects handoff forms and prints the CV to PDF, implementing the application's ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jobbot-app = { path = "../jobbot-app" }
jobbot-domain = { path = "../jobbot-domain" }
anyhow.workspace = true
async-trait.workspace = true
playwright-rs.workspace = true
pulldown-cmark.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt", "time"] }
url.workspace = true

[dev-dependencies]
jobbot-testkit = { path = "../jobbot-testkit" }
pdf-extract.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "time"] }
wiremock.workspace = true

[lints]
workspace = true
