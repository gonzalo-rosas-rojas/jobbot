[package]
name = "jobbot-testkit"
description = "jobbot's test support: the shared fixtures, a fake Claude, the shipped profile's location and the real stores in memory. A dev-dependency only; nothing that ships depends on it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jobbot-app = { path = "../jobbot-app" }
jobbot-domain = { path = "../jobbot-domain" }
jobbot-store = { path = "../jobbot-store" }
async-trait.workspace = true
chrono.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-core.workspace = true
url.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
