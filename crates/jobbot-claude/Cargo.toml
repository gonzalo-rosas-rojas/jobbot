[package]
name = "jobbot-claude"
description = "jobbot's Claude runner: headless `claude -p` as a child process on the private subscription only, with a scrubbed environment, its own config folder and a JSON reply."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jobbot-app = { path = "../jobbot-app" }
jobbot-domain = { path = "../jobbot-domain" }
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "rt", "time"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
